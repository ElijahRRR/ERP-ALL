# 生产前端伺服（INFRA-0716）。上游 api 为 compose 服务名。
# 缓存策略是本方案的核心：hashed 资产永久缓存、应用壳永不缓存——
# 换版本 = 换 index.html 里的资产指纹，浏览器不可能再跑旧模块。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 全链健康检查：后端健康端点在根路径 /healthz（不带 /api 前缀），
    # 精确映射一条，供运维从前门核验 nginx→api 链路
    location = /api/healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
    }

    # 后端反代（与 vite dev 代理同路径语义：/api 与 portal 预留）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /portal/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # vite 产物：/assets/* 文件名带内容指纹——不可变，放心永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 应用壳：永不缓存（stale 模块类事故的最后一道闸）
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri /index.html;
    }
}

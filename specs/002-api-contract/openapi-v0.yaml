openapi: 3.1.0
info:
  title: ERP-ALL API
  version: 0.1.0-draft
  description: >
    契约草案 v0（EA-002）。五个核心上下文：identity / channel / catalog / listing / order + 采购门户。
    全局约定见同目录 README.md；数据语义以 specs/001-domain-model/ 为准。
    x-permission = 所需权限点（permission.code），网关中间件按此校验。
servers:
  - url: /api/v1
    description: 内部 API（JWT audience=erp）
  - url: /portal/v1
    description: 采购门户 API（JWT audience=portal，仅 Portal tag 下端点）

tags:
  - {name: Auth}
  - {name: Identity}
  - {name: Channel}
  - {name: Catalog}
  - {name: Listing}
  - {name: Order}
  - {name: Aftersale, description: 退货与退款（R2-07）}
  - {name: Automation, description: 自动化档位面板：流程级三档开关（D-Q13/29；flow 注册表见 001 §09）}
  - {name: Compliance, description: 合规数据供给：黑名单/商标/TRO/导入作业（R2-12）}
  - {name: Audit, description: 商品审核（L0/L2/L3 分层判定）}
  - {name: Scrape, description: 采集工单与采集端（内部 API 面）}
  - {name: Notify, description: 通知中心：列表/未读数/已读（任何登录用户可用，无权限点）}
  - {name: ScrapeWorker, description: 采集节点回调面（X-Node-Key + X-Node-Token 双头部认证，非 JWT）}
  - {name: Portal, description: 采购方门户（独立认证域，白名单最小面）}

security:
  - bearerAuth: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: 内部登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: 刷新 access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPair'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出（token_version+1 吊销全部会话可选参数 all=true）
      responses:
        '204': {description: 已登出}
  /me:
    get:
      tags: [Auth]
      summary: 当前用户与权限点集合
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: {$ref: '#/components/schemas/User'}
                  permissions: {type: array, items: {type: string}}

  # ─────────────────────── Identity ───────────────────────
  /teams:
    get:
      tags: [Identity]
      summary: 团队列表（超管）
      x-permission: identity.team_admin
      responses: {'200': {$ref: '#/components/responses/TeamPage'}}
    post:
      tags: [Identity]
      summary: 建团队（超管独占，D-Q30）
      x-permission: identity.team_admin
      requestBody: {$ref: '#/components/requestBodies/TeamWrite'}
      responses: {'201': {$ref: '#/components/responses/Team'}}
  /teams/{teamId}:
    patch:
      tags: [Identity]
      summary: 改团队（名称/状态/settings）
      x-permission: identity.team_admin
      parameters: [{$ref: '#/components/parameters/teamId'}]
      requestBody: {$ref: '#/components/requestBodies/TeamWrite'}
      responses: {'200': {$ref: '#/components/responses/Team'}}
  /users:
    get:
      tags: [Identity]
      summary: 本团队成员列表
      x-permission: identity.user_read
      parameters: [{$ref: '#/components/parameters/page'}, {$ref: '#/components/parameters/size'}]
      responses: {'200': {$ref: '#/components/responses/UserPage'}}
    post:
      tags: [Identity]
      summary: 开成员账号
      x-permission: identity.user_write
      requestBody: {$ref: '#/components/requestBodies/UserWrite'}
      responses: {'201': {$ref: '#/components/responses/UserResp'}}
  /users/{userId}:
    get:
      tags: [Identity]
      x-permission: identity.user_read
      parameters: [{$ref: '#/components/parameters/userId'}]
      responses: {'200': {$ref: '#/components/responses/UserResp'}}
    patch:
      tags: [Identity]
      summary: 改成员（display_name/status/重置密码）
      x-permission: identity.user_write
      parameters: [{$ref: '#/components/parameters/userId'}]
      requestBody: {$ref: '#/components/requestBodies/UserWrite'}
      responses: {'200': {$ref: '#/components/responses/UserResp'}}
  /users/{userId}/roles:
    put:
      tags: [Identity]
      summary: 全量设置成员角色
      x-permission: identity.user_write
      parameters: [{$ref: '#/components/parameters/userId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role_ids]
              properties: {role_ids: {type: array, items: {type: integer}}}
      responses: {'200': {$ref: '#/components/responses/UserResp'}}
  /roles:
    get:
      tags: [Identity]
      x-permission: identity.user_read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Role'}}
    post:
      tags: [Identity]
      x-permission: identity.role_write
      requestBody: {$ref: '#/components/requestBodies/RoleWrite'}
      responses: {'201': {description: Created}}
  /roles/{roleId}:
    patch:
      tags: [Identity]
      x-permission: identity.role_write
      parameters: [{$ref: '#/components/parameters/roleId'}]
      requestBody: {$ref: '#/components/requestBodies/RoleWrite'}
      responses: {'200': {description: OK}}
  /roles/{roleId}/permissions:
    put:
      tags: [Identity]
      summary: 全量设置角色权限点
      x-permission: identity.role_write
      parameters: [{$ref: '#/components/parameters/roleId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [permission_codes]
              properties: {permission_codes: {type: array, items: {type: string}}}
      responses: {'200': {description: OK}}
  /permissions:
    get:
      tags: [Identity]
      summary: 权限点全集（前端勾选界面数据源）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Permission'}}
  /audit-logs:
    get:
      tags: [Identity]
      summary: 审计日志查询
      x-permission: identity.audit_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: actor_id, in: query, schema: {type: integer}}
        - {name: object_type, in: query, schema: {type: string}}
        - {name: object_id, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: occurred_after, in: query, schema: {type: string, format: date-time}}
        - {name: occurred_before, in: query, schema: {type: string, format: date-time}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AuditLogPage'}}}}}
  /dicts/{dictType}:
    get:
      tags: [Identity]
      summary: 字典取值下发（枚举不硬编码）
      security: []
      parameters: [{name: dictType, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DictItem'}}

  # ─────────────────────── Channel ───────────────────────
  /stores:
    get:
      tags: [Channel]
      x-permission: channel.store_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [active, paused, suspended, closed]}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/StorePage'}}}}}
    post:
      tags: [Channel]
      x-permission: channel.store_write
      requestBody: {$ref: '#/components/requestBodies/StoreWrite'}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Store'}}}}}
  /stores/{storeId}:
    get:
      tags: [Channel]
      x-permission: channel.store_read
      parameters: [{$ref: '#/components/parameters/storeId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Store'}}}}}
    patch:
      tags: [Channel]
      x-permission: channel.store_write
      parameters: [{$ref: '#/components/parameters/storeId'}]
      requestBody: {$ref: '#/components/requestBodies/StoreWrite'}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Store'}}}}}
  /stores/{storeId}/credential:
    get:
      tags: [Channel]
      summary: 凭证状态（永不回显 secret）
      x-permission: channel.credential_view
      parameters: [{$ref: '#/components/parameters/storeId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  client_id_masked: {type: string, examples: ['ab12****']}
                  updated_at: {type: string, format: date-time}
    put:
      tags: [Channel]
      summary: 设置/更换凭证（加密落库，记 audit_log）
      x-permission: channel.credential_write
      parameters: [{$ref: '#/components/parameters/storeId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret]
              properties:
                client_id: {type: string}
                client_secret: {type: string, format: password}
      responses: {'204': {description: 已更新}}
  /stores/{storeId}/proxy:
    put:
      tags: [Channel]
      summary: 换绑出口代理（独占校验：一代理一店）
      x-permission: channel.store_write
      parameters: [{$ref: '#/components/parameters/storeId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [proxy_id]
              properties: {proxy_id: {type: integer}}
      responses:
        '204': {description: 已换绑}
        '409': {description: 代理已被其他店占用, $ref: '#/components/responses/Error'}
  /stores/{storeId}/quota-configs:
    get:
      tags: [Channel]
      x-permission: channel.store_read
      parameters: [{$ref: '#/components/parameters/storeId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QuotaConfig'}}}}}}
    put:
      tags: [Channel]
      summary: 全量设置三向配额（D-Q10）
      x-permission: channel.quota_write
      parameters: [{$ref: '#/components/parameters/storeId'}]
      requestBody:
        content:
          application/json:
            schema: {type: array, items: {$ref: '#/components/schemas/QuotaConfig'}}
      responses: {'200': {description: OK}}
  /stores/{storeId}/quota-usage:
    get:
      tags: [Channel]
      summary: 当日/指定日配额用量
      x-permission: channel.store_read
      parameters:
        - {$ref: '#/components/parameters/storeId'}
        - {name: date, in: query, schema: {type: string, format: date}}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/QuotaUsage'}}}}}}
  /proxies:
    get:
      tags: [Channel]
      x-permission: channel.proxy_read
      parameters: [{$ref: '#/components/parameters/page'}, {$ref: '#/components/parameters/size'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProxyPage'}}}}}
    post:
      tags: [Channel]
      x-permission: channel.proxy_write
      requestBody: {$ref: '#/components/requestBodies/ProxyWrite'}
      responses: {'201': {description: Created}}
  /proxies/{proxyId}:
    patch:
      tags: [Channel]
      x-permission: channel.proxy_write
      parameters: [{name: proxyId, in: path, required: true, schema: {type: integer}}]
      requestBody: {$ref: '#/components/requestBodies/ProxyWrite'}
      responses: {'200': {description: OK}}
  /store-incidents:
    get:
      tags: [Channel]
      x-permission: channel.incident_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/StoreIncidentPage'}}}}}
    post:
      tags: [Channel]
      summary: 人工登记店铺事件（封店等，D-Q33）
      x-permission: channel.incident_write
      requestBody: {$ref: '#/components/requestBodies/StoreIncidentWrite'}
      responses: {'201': {description: Created}}
  /store-incidents/{incidentId}/transition:
    post:
      tags: [Channel]
      summary: 事件状态推进（observing/appealing/resolved/closed）+ 触发释放作业
      x-permission: channel.incident_write
      parameters: [{$ref: '#/components/parameters/incidentId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [to_status]
              properties:
                to_status: {type: string, enum: [observing, appealing, resolved, closed]}
                notes: {type: string}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/Error'}}

  # ─────────────────────── Scrape ───────────────────────
  # worker 拨入机器协议（/worker/v1/*）不在本 UI 契约内，见 worker-protocol.md
  /scrape-jobs:
    get:
      tags: [Scrape]
      summary: 采集作业列表
      x-permission: scrape.job_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [pending, running, done, partial, failed, cancelled]}}
        - {name: job_kind, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ScrapeJobPage'}}}}}
    post:
      tags: [Scrape]
      summary: 建采集作业（R1 仅 product_detail；input.targets=ASIN 列表）
      x-permission: scrape.job_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, job_kind, input]
              properties:
                source: {type: string, enum: [amazon, walmart]}
                job_kind: {type: string, enum: [product_detail, keyword, seller, bestseller, price_watch]}
                input: {type: object, description: 'product_detail: {targets: [ASIN...]}'}
                priority: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses: {'201': {description: 已创建并展开任务}, '422': {$ref: '#/components/responses/Error'}}
  /scrape-jobs/{jobId}:
    get:
      tags: [Scrape]
      summary: 作业详情（含任务状态分布）
      x-permission: scrape.job_read
      parameters: [{name: jobId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK}, '422': {$ref: '#/components/responses/Error'}}
  /scrape-jobs/{jobId}/cancel:
    post:
      tags: [Scrape]
      summary: 取消作业（未派发任务判死；在途迟到结果照常入库）
      x-permission: scrape.job_write
      parameters: [{name: jobId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK}, '422': {$ref: '#/components/responses/Error'}}
  /worker-nodes:
    get:
      tags: [Scrape]
      summary: 采集节点台账（全局基础设施）
      x-permission: scrape.node_admin
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WorkerNode'}}}}}}

  # ─────────────────────── Audit ───────────────────────
  /products/{productId}/audit:
    post:
      tags: [Audit]
      summary: 发起单品审核（同步；R1 层级 l0/l2/l3，l4 未开放）
      x-permission: audit.run
      parameters: [{name: productId, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                levels: {type: array, items: {type: string, enum: [l0, l1, l2, l3, l4]}}
                trigger_kind: {type: string, enum: [auto, manual, batch, re_audit], default: manual}
      responses:
        '201': {description: 审核完成, content: {application/json: {schema: {$ref: '#/components/schemas/AuditResult'}}}}
        '422': {$ref: '#/components/responses/Error'}
  # R2-09 增量3a 契约补充：纯手工批量送审（把「一个一个点」变成「勾一批点一次」）。
  # **不读 automation_policy、不接三档**——三档贯通属增量3，本端点只是单品送审的循环。
  /products/audit:
    post:
      tags: [Audit]
      summary: 批量送审（同步逐条执行；等价于对每个 product_id 各调一次单品送审）
      description: >-
        逐条调用与单品送审**同一段**三段式内核（`audit/service.py::audit_one`），
        trigger_kind 由服务端恒写 `batch`——请求体不接受该字段，避免批量路径伪装成人工/自动。
        入参按首次出现保序去重。


        **部分成功正常返回 200，不整批失败**：每条自己 COMMIT 两次，第 N 条出事时前 N-1 条
        的 run 已落库、LLM 的钱已花；此时返回 4xx 就成了「响应说失败、库里成功了 N-1 条」的谎，
        且审核域无 DELETE 授权、补偿路径不存在。故除下方三类整批 4xx（**都在任何一条开审之前**
        判定、零金钱代价）外，一律逐条进桶。


        两道刹车会提前收尾，剩下的进 `remaining`：**墙钟预算**——每条开审**前**检查已耗时，
        超预算即停，它限制的是「一次请求最多花多少钱、最多留多少条 run」。
        ⚠️ 它**不保证**在网关超时内返回：预算只在开审前检查，最后放行的那条仍可跑满单条
        最坏耗时（llm 超时 120s × 重试 2 次 = 240s），故本端点真实上界 = 预算 90s + 240s
        = **330s**，而 `frontend/nginx.conf` 的 `proxy_read_timeout` 是 120s。越界那次由
        「504 → 客户端用**同一个** Idempotency-Key 重试 → 命中处理中(409)或存储响应」这条
        链兜底，因此幂等占位的失效阈值（30min）必须大于 330s；**provider 熔断**——连续多条
        needs_review 且这几条 run 都带 `rule_code='llm_unavailable'` 的 hit 才跳闸
        （非连续、或 `l3_policy_missing` 这类真判定不跳闸）。两者覆盖不同故障：
        provider 挂死→墙钟先刹，provider 快速报错→只有熔断拦得住。
      x-permission: audit.run
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_ids]
              properties:
                product_ids: {type: array, items: {type: integer}, description: '**无数量上限**（Owner 2026-07-28 裁定，刻意不设 maxItems）——成本由墙钟预算约束，不由件数约束；超预算的部分进 remaining 由前端续跑'}
                levels: {type: array, items: {type: string, enum: [l0, l1, l2, l3, l4]}, description: '默认 l0/l2/l3。枚举**服务端强制**（`audit/router.py::_resolve_levels`，单品与批量共用一段）：非法值整批 422 AUDIT_LEVELS_INVALID，含 l4 整批 422 AUDIT_L4_DISABLED。为什么必须强制——审核编排里每层都是 `if "lN" in levels` 的精确匹配，`["L0"]` 这样的大小写笔误会一层都不命中而 verdict 保持初值 pass，整批产品零检查落 audit_passed'}
      responses:
        '200':
          description: 逐条结果（部分成功即此码；只有下方两类 4xx 才是整批拒绝）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditBatchResult'}
        '409': {description: 幂等键冲突（同键异载荷/处理中）, $ref: '#/components/responses/Error'}
        '422': {description: '业务层整批拒绝仅此三类，都在开审之前判定、无任何一条已落库或已花钱：AUDIT_TEAM_REQUIRED（超管未带 X-Act-Team）/ AUDIT_LEVELS_INVALID（levels 含 l0..l4 之外的值，含大小写写错）/ AUDIT_L4_DISABLED（levels 含 l4）。**另有一类不到业务层的 422**：缺 product_ids、元素非整数、缺 Idempotency-Key 头由 FastAPI 请求校验直接拒，走默认 `{detail: [...]}` 信封而**非** 002 错误信封（无 error.code）', $ref: '#/components/responses/Error'}
  /audit-runs:
    get:
      tags: [Audit]
      summary: 审核运行列表
      x-permission: audit.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: product_id, in: query, schema: {type: integer}}
        - {name: verdict, in: query, schema: {type: string, enum: [pass, reject, needs_review]}}
      responses: {'200': {description: OK}}
  /audit-runs/{runId}:
    get:
      tags: [Audit]
      summary: 审核运行详情（含逐层命中证据）
      x-permission: audit.read
      parameters: [{name: runId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK}, '422': {$ref: '#/components/responses/Error'}}

  # ─────────────────────── Catalog ───────────────────────
  /products:
    get:
      tags: [Catalog]
      x-permission: catalog.product_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string}}
        - {name: brand, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}, description: 标题/ASIN/master_sku 搜索}
        - name: include_retired
          in: query
          schema: {type: boolean, default: false}
          description: >-
            是否包含已下架（retired）产品。默认 false 即折叠（00-conventions §7.1：
            列表默认隐藏已停用/已归档项）。**显式传 status 时本参数不生效**——
            按状态精确筛选优先，否则选「已下架」会得到空列表。
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProductPage'}}}}}
  /products/{productId}:
    get:
      tags: [Catalog]
      x-permission: catalog.product_read
      parameters: [{$ref: '#/components/parameters/productId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}}
    patch:
      tags: [Catalog]
      summary: 编辑产品（title/attrs/images；不可改 master_sku/source_ref）
      x-permission: catalog.product_write
      parameters: [{$ref: '#/components/parameters/productId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                attrs: {type: object}
                images: {type: array, items: {type: string, format: uri}}
      responses: {'200': {description: OK}}
  /variant-groups:
    get:
      tags: [Catalog]
      x-permission: catalog.product_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [active, broken]}}
        - {name: q, in: query, schema: {type: string}, description: source_parent_ref 精确查（R2-11 增补）}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/VariantGroupPage'}}}}}
    post:
      tags: [Catalog]
      summary: 建变体组（D-Q2）
      x-permission: catalog.product_write
      requestBody: {$ref: '#/components/requestBodies/VariantGroupWrite'}
      responses: {'201': {description: Created}}
  /variant-groups/{groupId}/members:
    put:
      tags: [Catalog]
      summary: 全量设置组成员与维度值
      x-permission: catalog.product_write
      parameters: [{name: groupId, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [product_id, variant_attrs]
                properties:
                  product_id: {type: integer}
                  variant_attrs: {type: object}
                  is_primary: {type: boolean}
      responses: {'200': {description: OK}}
  /variant-groups/{groupId}/anchor/release:
    post:
      tags: [Catalog]
      summary: 解锁组 anchor（首发即败换店重投场景；R2-11 检修增补，替代 runbook 手工 SQL）
      x-permission: catalog.product_write
      parameters: [{name: groupId, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: 'OK（{group_id, released_store_id, detail=组详情}）'}
        '409': {description: 未锚定（VARIANT_ANCHOR_NOT_SET）或锚定店仍有在途/在架成员（VARIANT_ANCHOR_IN_USE，fail-closed）}
  /gtin-pool/stats:
    get:
      tags: [Catalog]
      summary: GTIN 池水位（按 kind × status 统计）
      x-permission: catalog.gtin_read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    gtin_kind: {type: string, enum: [upc_a, ean_13]}
                    status: {type: string, enum: [free, held, used, conflict, invalid]}
                    count: {type: integer}
  /gtin-pool:
    get:
      tags: [Catalog]
      x-permission: catalog.gtin_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string}}
        - {name: gtin_kind, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/GtinPage'}}}}}
  # import-jobs 归属 Compliance（R2-12 增量5）：权限码 compliance.import_*（0010 种子），
  # 此前契约误标 catalog.import_*/Catalog——与路由/种子不符，一并归正。导入执行走 CLI
  # （部署机 api 容器读本地文件，大文件不经 HTTP、全局数据需超管 system_tx——router 铁律），
  # 故不提供 HTTP 上传端点；页面仅看进度 + 拉报错报告。
  /import-jobs:
    get:
      tags: [Compliance]
      summary: 导入作业历史（供给链进度可视；执行走 CLI 部署机，D-Q35）
      x-permission: compliance.import_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: domain, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ImportJobPage'}}}}}
  /import-jobs/{jobId}:
    get:
      tags: [Compliance]
      x-permission: compliance.import_read
      parameters: [{name: jobId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ImportJob'}}}}}
  /import-jobs/{jobId}/error-report:
    get:
      tags: [Compliance]
      summary: 导入作业报错报告（err_rows 明细 + 逐块核对；对账可见性底线 008§6）
      x-permission: compliance.import_read
      parameters: [{name: jobId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ImportErrorReport'}}}}}
  /category-map:
    get:
      tags: [Catalog]
      summary: 类目映射查询
      x-permission: catalog.product_read
      parameters:
        - {name: amazon_leaf_id, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryMapPage'}}}}}
  /category-map/{mapId}:
    patch:
      tags: [Catalog]
      summary: 人工修正映射（map_source=manual 优先级最高）
      x-permission: catalog.category_write
      parameters: [{name: mapId, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                wpt: {type: string}
                status: {type: string, enum: [active, deprecated]}
      responses: {'200': {description: OK}}
  /products/{productId}/sources:
    get:
      tags: [Catalog]
      x-permission: catalog.product_read
      parameters: [{$ref: '#/components/parameters/productId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProductSource'}}}}}}
    post:
      tags: [Catalog]
      summary: 录入货源（confirmed 驱动 product→ready，D-Q25/41）
      x-permission: catalog.source_write
      parameters: [{$ref: '#/components/parameters/productId'}]
      requestBody: {$ref: '#/components/requestBodies/ProductSourceWrite'}
      responses: {'201': {description: Created}}
  /brand-assignments:
    get:
      tags: [Catalog]
      summary: 品牌店铺占用列表（封店工作流品牌占用视图，D-Q33）
      x-permission: catalog.brand_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: store_id, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [occupied, released]}}
        - {name: q, in: query, schema: {type: string}, description: 品牌名查询}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BrandAssignmentPage'}}}}}
  /brand-assignments/{assignmentId}/release:
    post:
      tags: [Catalog]
      summary: 手工释放品牌占用（occupied→released，release_reason=manual；封店批量释放走 store-incidents）
      x-permission: catalog.brand_release
      parameters: [{$ref: '#/components/parameters/assignmentId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: {type: string}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BrandAssignment'}}}}
        '409': {$ref: '#/components/responses/Error'}

  # ─────────────────────── Compliance（R2-12 增量5 合规中心）───────────────────────
  # 断言账本 canonical + 追溯 + 候选闸（RS-04D/D-Q65）、商标库、TRO 案件——合规供给
  # 链的人眼窗口 + 定点人工裁决。黑名单 domain ∈ 断言六域（001§04）。
  /blacklist:
    get:
      tags: [Compliance]
      summary: 黑名单 canonical 有效项（按域，断言投影当前生效面）
      x-permission: compliance.blacklist_read
      parameters:
        - {name: domain, in: query, required: true, schema: {type: string, enum: [brand, seller, asin, category, address, zip]}}
        - {name: q, in: query, schema: {type: string}, description: 主体模糊查询（ILIKE）}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BlacklistEntryPage'}}}}}
  /blacklist/trace:
    get:
      tags: [Compliance]
      summary: 断言追溯（某主体的全部源断言，任意状态；撤销留行）
      x-permission: compliance.blacklist_read
      parameters:
        - {name: domain, in: query, required: true, schema: {type: string}}
        - {name: subject, in: query, required: true, schema: {type: string}, description: subject_norm 精确}
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BlacklistAssertion'}}}}}}
  /blacklist/pending:
    get:
      tags: [Compliance]
      summary: 候选断言队列（D-Q65② 报错回收人工闸；pending 待裁决）
      x-permission: compliance.blacklist_read
      parameters:
        - {name: domain, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BlacklistAssertionPage'}}}}}
  /blacklist/assertions:
    post:
      tags: [Compliance]
      summary: 人工登记断言（source=manual；block 拉黑 / allow 白名单裁决压自动源）
      x-permission: compliance.blacklist_write
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [domain, subject_norm]
              properties:
                domain: {type: string, enum: [brand, seller, asin, category, address, zip]}
                subject_norm: {type: string}
                subject_display: {type: string}
                verdict: {type: string, enum: [block, allow], default: block}
                reason: {type: string}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/AssertionResult'}}}}
        '400': {$ref: '#/components/responses/Error'}
  /blacklist/assertions/{assertionId}/decide:
    post:
      tags: [Compliance]
      summary: 裁决候选断言（pending→active/revoked，D-Q65② 人工闸）
      x-permission: compliance.blacklist_write
      parameters:
        - {name: assertionId, in: path, required: true, schema: {type: integer}}
        - {$ref: '#/components/parameters/idempotencyKey'}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties: {approve: {type: boolean}, reason: {type: string}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AssertionResult'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /blacklist/assertions/{assertionId}/revoke:
    post:
      tags: [Compliance]
      summary: 撤销断言（active/pending→revoked，留行；主体是否仍拉黑由余源决定）
      x-permission: compliance.blacklist_write
      parameters:
        - {name: assertionId, in: path, required: true, schema: {type: integer}}
        - {$ref: '#/components/parameters/idempotencyKey'}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {reason: {type: string}}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AssertionResult'}}}}
        '409': {$ref: '#/components/responses/Error'}
  /trademarks:
    get:
      tags: [Compliance]
      summary: 商标库查询（mark_norm trigram 模糊 + Nice 类过滤 + LIVE 过滤）
      x-permission: compliance.trademark_read
      parameters:
        - {name: q, in: query, schema: {type: string}, description: 商标名（trigram 相似，ILIKE 兜底）}
        - {name: nice, in: query, schema: {type: integer}, description: Nice 类号过滤（nice_classes 含）}
        - {name: live_only, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TrademarkPage'}}}}}
  /tro-cases:
    get:
      tags: [Compliance]
      summary: TRO 案件查询（品牌词/原告/案号 q + 状态过滤）
      x-permission: compliance.tro_read
      parameters:
        - {name: q, in: query, schema: {type: string}, description: 案号/原告/品牌词模糊}
        - {name: status, in: query, schema: {type: string, enum: [active, dismissed, settled]}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TroCasePage'}}}}}

  # ─────────────────────── Listing ───────────────────────
  /listings:
    get:
      tags: [Listing]
      x-permission: listing.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: store_id, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string}}
        - {name: offer_mode, in: query, schema: {type: string, enum: [build, match]}}
        - {name: error_code, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ListingPage'}}}}}
  /listings/allocate:
    post:
      tags: [Listing]
      summary: 分配上架（批量建 draft：产品×店铺×模式；含去重/品牌占用/GTIN 预占）
      x-permission: listing.allocate
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [product_ids, store_id, offer_mode]
              properties:
                product_ids: {type: array, items: {type: integer}, maxItems: 500}
                store_id: {type: integer}
                offer_mode: {type: string, enum: [build, match]}
      responses:
        '200':
          description: 逐品结果（部分成功正常返回）
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: {type: array, items: {$ref: '#/components/schemas/Listing'}}
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: {type: integer}
                        code: {type: string, examples: [LISTING_DUP_IN_TEAM, BRAND_OCCUPIED_OTHER_STORE, GTIN_POOL_EMPTY, PRODUCT_NOT_READY]}
                        message: {type: string}
        '409': {description: 幂等键冲突（同键异载荷/处理中）, $ref: '#/components/responses/Error'}
  /listings/{listingId}:
    get:
      tags: [Listing]
      x-permission: listing.read
      parameters: [{$ref: '#/components/parameters/listingId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ListingDetail'}}}}}
    patch:
      tags: [Listing]
      summary: 提交前改价（draft/failed 直改；live 归定价管道推渠道）——HF-0716/R2-06
      x-permission: listing.submit
      parameters: [{$ref: '#/components/parameters/listingId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price]
              properties:
                price: {type: number}
                force: {type: boolean, default: false, description: BR-PR-008 变动超阈（默认 30%）需二次确认}
      responses:
        '200': {description: OK}
        '422': {description: 价格非法/状态不可改/超阈未 force, $ref: '#/components/responses/Error'}
  /listings/submit:
    post:
      tags: [Listing]
      summary: 批量提交上架（异步：构建 spec→组 feed→网关提交；消耗 listing_create 配额）
      x-permission: listing.submit
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [listing_ids]
              properties:
                listing_ids: {type: array, items: {type: integer}, maxItems: 500}
                variant_mode: {type: string, enum: [group, standalone], default: group, description: D-Q64②——group=自动路由（默认：分组产品携 VG 段成组、未分组自动散品，混批一 feed，前端文案「自动路由」）；standalone=覆盖开关，整批强制散品（不带 VG 段、不锁 anchor、不受组守卫限制）}
      responses:
        '202': {description: 已入队, content: {application/json: {schema: {type: object, properties: {queued: {type: integer}, skipped: {type: array, items: {type: object}}}}}}}
        '409': {description: 幂等键冲突（同键异载荷/处理中）, $ref: '#/components/responses/Error'}
        '422': {description: 配额不足等业务拒绝, $ref: '#/components/responses/Error'}
  /listings/variant-regroup:
    post:
      tags: [Listing]
      summary: live 组成员补挂 VG 段重投（D-Q64④ 散品转成组；item_regroup 独立归位——失败不动 listing 状态/不释放 GTIN）
      x-permission: listing.submit
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [group_id, store_id]
              properties:
                group_id: {type: integer}
                store_id: {type: integer}
      responses:
        '202': {description: '已入队（{queued, feed_id}）'}
        '409': {description: 幂等键冲突, $ref: '#/components/responses/Error'}
        '422': {description: 组 broken / anchor 异店 / 无在架成员 / 超单批上限 / 配额不足（批次原子性整批拒绝）, $ref: '#/components/responses/Error'}
  /listings/{listingId}/delist:
    post:
      tags: [Listing]
      summary: 下架（异步；消耗 listing_delete 配额）
      x-permission: listing.delist
      parameters: [{$ref: '#/components/parameters/listingId'}, {$ref: '#/components/parameters/idempotencyKey'}]
      responses: {'202': {description: 已入队}, '409': {description: 幂等键冲突（同键异载荷/处理中）, $ref: '#/components/responses/Error'}}
  /listings/{listingId}/retry:
    post:
      tags: [Listing]
      summary: failed 重投（按 error catalog 处置校验）
      x-permission: listing.submit
      parameters: [{$ref: '#/components/parameters/listingId'}]
      responses: {'202': {description: 已入队}, '409': {$ref: '#/components/responses/Error'}}
  /feeds:
    get:
      tags: [Listing]
      x-permission: listing.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: store_id, in: query, schema: {type: integer}}
        - {name: feed_kind, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/FeedPage'}}}}}
  /feeds/{feedId}:
    get:
      tags: [Listing]
      x-permission: listing.read
      parameters: [{name: feedId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Feed'}}}}}
  /feeds/{feedId}/items:
    get:
      tags: [Listing]
      summary: item 级权威结果（headline 不可信）
      x-permission: listing.read
      parameters:
        - {name: feedId, in: path, required: true, schema: {type: integer}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [pending, success, error]}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/FeedItemPage'}}}}}
  /feeds/{feedId}/poll:
    post:
      tags: [Listing]
      summary: 手动轮询 feed 状态（item 级权威回写；beat 自动轮询 R2）
      x-permission: listing.submit
      parameters: [{name: feedId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK}, '422': {$ref: '#/components/responses/Error'}}
  /feeds/{feedId}/verify-back:
    post:
      tags: [Listing]
      summary: verify_pending 对账归位（adopt/lost）——提交无响应永不盲重试
      x-permission: listing.submit
      parameters: [{name: feedId, in: path, required: true, schema: {type: integer}}]
      responses: {'200': {description: OK}, '422': {$ref: '#/components/responses/Error'}}
  /gtin-pool/import:
    post:
      tags: [Catalog]
      summary: GTIN 批量导入（格式+GS1校验位+首位白名单 BR-UPC-002；重复/受限前缀逐条报告）
      x-permission: catalog.import_write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gtins]
              properties:
                gtins: {type: array, items: {type: string}, maxItems: 10000}
                source: {type: string, enum: [generator_import, feishu_import, purchased], default: generator_import}
      responses: {'201': {description: '{imported, rejected[]}'}}
  /pricing-strategies:
    get:
      tags: [Listing]
      x-permission: pricing.read
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PricingStrategy'}}}}}}
    post:
      tags: [Listing]
      summary: 建策略（(team×store×offer_mode) 活跃唯一，D-Q23）
      x-permission: pricing.write
      requestBody: {$ref: '#/components/requestBodies/PricingStrategyWrite'}
      responses: {'201': {description: Created}, '409': {$ref: '#/components/responses/Error'}}
  /pricing-strategies/{strategyId}:
    patch:
      tags: [Listing]
      x-permission: pricing.write
      parameters: [{name: strategyId, in: path, required: true, schema: {type: integer}}]
      requestBody: {$ref: '#/components/requestBodies/PricingStrategyWrite'}
      responses: {'200': {description: OK}}
  # R2-06 增量2 契约补充冻结：重定价预览（只读试算不落库）
  /pricing-strategies/preview:
    post:
      tags: [Listing]
      summary: 重定价预览（clamp 版展示区间外情况 + compute_price 严格判定并列返回；manual 策略 reason='manual'）
      x-permission: pricing.read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store_id, offer_mode]
              properties:
                store_id: {type: integer}
                offer_mode: {type: string, enum: [build, match]}
                product_ids: {type: array, items: {type: integer}, maxItems: 200, description: 与 listing_ids 二选一}
                listing_ids: {type: array, items: {type: integer}, maxItems: 200, description: 与 product_ids 二选一（join listing 取 product + current_price 作 old_price）}
      responses:
        '200':
          description: 试算结果（不落库）
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy:
                    type: object
                    properties:
                      id: {type: integer}
                      name: {type: string}
                      algo_code: {type: string}
                      version: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: {type: integer}
                        listing_id: {type: [integer, 'null']}
                        old_price: {type: [number, 'null']}
                        new_price: {type: [number, 'null'], description: clamp 版参考价（区间外 detail.out_of_band=true）}
                        ok: {type: boolean, description: compute_price 严格判定（区间外/低于底线为 false）}
                        reason: {type: [string, 'null'], examples: [out_of_band, below_min_price, no_source_price, manual, not_found]}
                        detail: {type: object}
        '422': {description: 无活跃策略（PRICING_STRATEGY_NOT_FOUND）/入参二选一违规 等业务拒绝, $ref: '#/components/responses/Error'}
  # R2-06 增量3 契约补充冻结：批量重定价（live listing 按策略算价 → PUT /v3/price 通道同步推渠道）
  /pricing/reprice:
    post:
      tags: [Listing]
      summary: 批量重定价（cost_plus 策略算价 → price_changed 过滤 → outbox price_push 三段式；manual 策略跳过）
      description: >-
        同步逐条执行（≤200 条 PUT）。PUT /v3/price 100/hour 限流器挡超额——被挡命令
        留 pending 由 beat channel_outbox_drain 兜底继续推（计入 pushed）；结果未知
        （verify_pending）由 price_recon 对账归位，绝不盲重试。
      x-permission: pricing.write
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_ids]
              properties:
                listing_ids: {type: array, items: {type: integer}, maxItems: 200}
                force: {type: boolean, default: false, description: 变动超确认阈值（默认 30%）时放行（BR-PR-008）}
      responses:
        '202':
          description: 执行结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  pushed: {type: integer, description: 已入队推送数（含 succeeded / verify_pending / 限流 pending）}
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        listing_id: {type: integer}
                        reason: {type: string, examples: [not_found, not_live, locked, no_strategy, manual, unchanged, out_of_band, below_min_price, no_source_price]}
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        listing_id: {type: integer}
                        code: {type: [string, 'null'], description: 渠道错误码 / HTTP_xxx / PRICING_CONFIRM_REQUIRED 等}
        '409': {description: 幂等键冲突（同键异载荷/处理中）, $ref: '#/components/responses/Error'}
  /maintenance-tasks:
    get:
      tags: [Listing]
      x-permission: listing.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: task_kind, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceTaskPage'}}}}}
    post:
      tags: [Listing]
      summary: 人工触发维护任务（改价/补库存/下架…）
      x-permission: listing.maintain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [listing_ids, task_kind]
              properties:
                listing_ids: {type: array, items: {type: integer}}
                task_kind: {type: string, enum: [price_sync, inventory_sync, title_fix, end_date_renewal, delist, relist, unlock_probe]}
                params: {type: object}
      responses: {'202': {description: 已入队}}
  /listing-errors:

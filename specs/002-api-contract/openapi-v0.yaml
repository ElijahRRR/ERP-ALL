      responses:
        '202': {description: 已入队, content: {application/json: {schema: {type: object, properties: {queued: {type: integer}, skipped: {type: array, items: {type: object}}}}}}}
        '409': {description: 幂等键冲突（同键异载荷/处理中）, $ref: '#/components/responses/Error'}

        actor_id: {type: [integer, 'null']}
        # R2-14 14b 验收③：在册用户=display_name；已删用户=「label（已删除）」（墓碑解析）；
        # 解析不到或非 user 操作者 = null（前端回落 actor_type#id）
        actor_label: {type: [string, 'null']}
        action: {type: string}
        object_type: {type: string}
        object_id: {type: string}
        before: {type: [object, 'null']}
        after: {type: [object, 'null']}
        ip: {type: [string, 'null']}
    AuditLogPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}}}
    AuditResult:
      type: object
      description: >
        一次审核的落库结果（`audit/service.py::audit_one` 的返回）。**单品送审 201 与批量
        audited[] 同源于本 schema**——批量只是循环调同一段内核，结果形状不该有第二套。
        `verdict=needs_review` 是**产生了 run** 的一种结果（判不下来，转人工复核），不是失败。
      required: [run_id, verdict, reject_level, llm_cost_usd, product_status]
      properties:
        run_id: {type: integer, description: app.audit_run.id}
        verdict: {type: string, enum: [pass, reject, needs_review]}
        reject_level: {type: [string, 'null'], enum: [l0, l1, l3, null], description: 首个否决层；verdict≠reject 时 null。**无 l2**——L2 是软证据只写 hit 不改 verdict；l4 未开放}
        llm_cost_usd: {type: number, description: 本次运行的 LLM 花费；缓存命中不计费故为 0}
        product_status: {type: [string, 'null'], description: 审核后的 product.status（audit_passed/audit_rejected/needs_review）；并发重审时本 run 让位于更新的 run，只留档不改状态，此时为 null}
    AuditBatchItem:
      description: audited[] 的一条 = 单品送审的结果 + product_id（只多回带 id，其余逐字同源）。
      allOf:
        - {$ref: '#/components/schemas/AuditResult'}
        - {type: object, required: [product_id], properties: {product_id: {type: integer}}}
    AuditBatchSkip:
      type: object
      description: >
        未产生可用结果的一条。`skipped` 与 `failed` 同形（都是 product_id + 错误码 + 人话），
        差别在代价而不在形状，故共用本 schema，取值范围见 AuditBatchResult 各字段的说明。
      required: [product_id, code, message]
      properties:
        product_id: {type: integer}
        code: {type: string, examples: [AUDIT_PRODUCT_NOT_FOUND, AUDIT_STATE_INVALID, AUDIT_ITEM_FAILED]}
        message: {type: string}
    AuditBatchResult:
      type: object
      description: >
        批量送审的逐条结果。**结构不变量**：`len(audited)+len(skipped)+len(failed)+len(remaining)`
        恒等于去重后的入参条数，四桶的 product_id 并集 == 去重入参、两两不交。
        前端据此可直接断言「一个都没漏」，不必自己拿入参回比。
      required: [audited, skipped, failed, remaining, verdict_counts, total_llm_cost_usd]
      properties:
        audited: {type: array, items: {$ref: '#/components/schemas/AuditBatchItem'}, description: 产生了 audit_run 的（含 verdict=needs_review）}
        skipped: {type: array, items: {$ref: '#/components/schemas/AuditBatchSkip'}, description: '开审之前即被判掉、未建 run，**零金钱代价**。code **只可能是这两个**（服务端按白名单归桶，白名单外的业务异常一律进 failed——「可能已扣费」的方向更保守，响应绝不能对成本说谎）：AUDIT_PRODUCT_NOT_FOUND=不存在**或**越权（他团队的 id 故意不分码，否则本端点可被拿来探测他团队 product_id 是否存在）；AUDIT_STATE_INVALID=当前状态不可发起审核'}
        failed: {type: array, items: {$ref: '#/components/schemas/AuditBatchSkip'}, description: '已开审但中途异常中断（AUDIT_ITEM_FAILED）。可能已建 run、已发生花费，代价与 skipped 不同故分桶；失败一条不中断整批。**该产品会停在 status=auditing**（tx1 已置、tx2 未及回写），运维处置见 `.agent/evidence/R2-09/runbook-increment3a.md`。message 只含错误类名与固定人话，原始异常文本只进服务端日志（它常含 SQL 片段/连接参数，而本字段会原样显示给运营）'}
        remaining: {type: array, items: {type: integer}, description: '**裸 id 数组**（保序）：因墙钟预算耗尽或 provider 熔断而**根本没轮到开审**的 product_id。不是失败、无任何代价，前端把它原样当作下一批的 product_ids 续跑即可。刻意不逐条生成 skipped 条目——剩余可能很多，逐条 message 只是把同一句话复制 N 遍'}
        verdict_counts:
          type: object
          description: audited[] 按 verdict 的计数；三键恒在（无该结果时为 0），三值之和 == len(audited)。
          required: [pass, reject, needs_review]
          properties:
            pass: {type: integer}
            reject: {type: integer}
            needs_review: {type: integer}
        total_llm_cost_usd: {type: number, description: '本批已发生的 LLM 花费合计 = audited[] 各条 llm_cost_usd 之和'}
        idempotent_replay: {type: boolean, description: 幂等重放才出现（`core/idempotency.py` 给存储响应加的标记），首次执行**无此键**——故不列入 required。true=本次一条都没重跑、一分钱没花，返回的是上次的结果；前端不该把它当作「又审了一遍」}
    ScrapeJob:

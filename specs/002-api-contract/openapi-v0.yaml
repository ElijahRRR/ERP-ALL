        label: {type: [string, 'null'], description: '语义=对应哪个指纹浏览器。**待认领/已驳回行为 null**——首见自动登记时服务端只知道一个 customerId，账号名是人给的'}
        site: {type: [string, 'null'], enum: [amazon_com, amazon_ca, amazon_co_jp, null], description: '**待认领/已驳回行为 null**（customerId 不含站点信息，编一个占位值是假话）。一旦转 active 必须齐全（库层 ck_buyer_account_claimed）'}
        external_customer_id: {type: string, description: '插件侧 customerId；**任务路由键，不是授权依据**。来源＝插件运行时从亚马逊页面现抓并随请求带上，由 ERP **首见自动登记**（图纸 07:288-340）；不是人工预录入'}
        status: {type: string, enum: [pending_claim, active, paused, blocked, retired, rejected], description: 'pending_claim=首见自动登记的待认领行（**一律不派单**）；rejected=已驳回终态（该 customerId 被永久占用，此后不再自动登记）'}
        daily_cap: {type: [integer, 'null'], description: null=不限。**日限的唯一权威就是这一列**}
        last_seen_at: {type: [string, 'null'], format: date-time, description: 该 customerId 最近一次被插件请求解析到的时间（掉线可见；待认领行同样刷新——运营据此看出这个未认领的号此刻真的在活动）}
        note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BuyerAccountPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/BuyerAccount'}}}}
    PluginInstance:
      type: object
      description: 采购插件实例＝**一台授权浏览器**（R2-13，图纸 07:274-286 + 本轮补 exec_mode）。**本 schema 逐字不含 token 的任何形态**，也**不含 buyer_account_id**——令牌不绑买家账号。
      properties:
        id: {type: integer, description: 逐实例链休眠期间仅作列表标识（D-Q73 17c 共享 token 不带实例头；多机归因重启后恢复为 X-Plugin-Instance 头的取值）}
        status: {type: string, enum: [active, revoked]}
        exec_mode: {type: string, enum: [dry_run, stop_before_payment, live], description: 'dry_run=不进结账页 / stop_before_payment=付款前停下回报（不花钱验收的主力档）/ live=完整下单'}
        version: {type: [string, 'null']}
        last_seen_customer_id: {type: [string, 'null'], description: '**观察值，不参与鉴权**（0044 头注六）：该浏览器最近一次带上来的 customerId，换号即自然更新。任何鉴权判定读它都等于把「令牌绑账号」偷偷接回来'}
        last_seen_account_label: {type: [string, 'null'], description: '由 last_seen_customer_id 在本团队内 JOIN 出来的账号名（未认领时为 null）。同为观察值'}
        last_seen_account_status: {type: [string, 'null'], description: '同上，账号状态；为 pending_claim 即「这台机器登的号还没认领」——运营看出该认领谁的唯一入口'}
        last_seen_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PluginInstancePage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/PluginInstance'}}}}
    PluginInstanceIssued:
      type: object
      description: 签发响应。**token 明文只在这里出现一次**，此后任何端点都取不到（库里只有 sha256）；遗失请吊销后重新签发。**不含 buyer_account_id**——令牌绑一台授权浏览器。
      required: [id, token]
      properties:
        id: {type: integer}
        token: {type: string, description: 实例专属令牌明文（禁全局共享密钥）。前端一次性展示后不得缓存、不得写 localStorage}
    # ── PurchasePlugin 机器面载荷（字段名逐字保留厂商 camelCase，理由见该组头注②）──
    PluginTask:
      type: object
      description: 一条待采购任务（字段集＝插件拍单流程实读，`07:216-224`）。展示用字段（products[].price/imgUrl/status）插件不读，**不造**。
      required: [id, orderNo, products, execMode]
      properties:
        id: {type: integer, description: procurement_order.id；全部回调的主键}
        orderNo: {type: string, description: '**渠道单号**（channel_order.channel_order_no）而不是 PO-{id}：插件把它写日志与回调参数，取渠道单号才能与 Walmart 后台直接对上'}
        receivingName: {type: [string, 'null']}
        receivingPhone: {type: [string, 'null']}
        receivingAddress: {type: [string, 'null'], description: address1；address2 非空时以换行拼接}
        receivingCity: {type: [string, 'null']}
        receivingDistrict: {type: [string, 'null'], description: JP 必填。**日本站本轮不做但字段与分支保留**（不做不等于删掉）}
        receivingPostCode: {type: [string, 'null']}
        receivingCountry: {type: [string, 'null'], description: 驱动插件的地址填写与校验分支}
        state: {type: [string, 'null'], description: 与 receivingState **两个字段名都返回、同值**——插件读的是 `order.state || order.receivingState`}
        receivingState: {type: [string, 'null']}
        products:
          type: array
          items:
            type: object
            required: [asin, quantity]
            properties:
              asin: {type: string, description: product.source_ref（source_channel=amazon）。**任一行解不出 ASIN 则整单不派**——少给一行会让插件少买一件且无人发现}
              quantity: {type: integer}
        execMode: {type: string, enum: [dry_run, stop_before_payment, live], description: 下发执行档，插件回报时原样回声}
    PluginSyncOrder:
      type: object
      description: 一条待物流同步订单。**响应字段未逐字取证**（见该组头注④），按最小集声明。
      required: [id, orderNo, platformOrderNo]
      properties:
        id: {type: integer}
        orderNo: {type: string}
        platformOrderNo: {type: string, description: 亚马逊订单号（procurement_order.purchase_order_ref）}
    PluginBackfillIn:
      type: object
      description: 采购完成回填体（逐字对齐插件实发）。金额字段是结账页原文字符串（如 "$1,234.56"）——服务端解析失败时该列留 NULL 并告警，**绝不写 0**（空值与解析不出是两件事）。
      required: [id]
      properties:
        id: {type: integer}
        platformOrderNo: {type: [string, 'null'], description: 亚马逊订单号，兼作幂等键}
        asins: {type: [string, 'null'], description: 逗号分隔；**不落列**，用于回填后核对（不符落 exception_kind=product）}
        deliveryTime: {type: [string, 'null'], description: 预计送达 YYYY-MM-DD → delivery_est_date}
        origDeliveryTime: {type: [string, 'null'], description: 结账页原文（如 "Thursday, August 7"）→ delivery_est_raw}
        creditCardNumber: {type: [string, 'null'], description: 卡号后四位 → payment_card_last4}
        mainPostCode: {type: [string, 'null'], description: '**不落列**，用于回填后核对邮编'}
        extPostCode: {type: [string, 'null']}
        shipping: {type: [string, number, 'null'], description: → freight_cost}
        totalBeforeTax: {type: [string, number, 'null'], description: 税前商品额 → purchase_cost}
        tax: {type: [string, number, 'null'], description: → tax_amount}
        total: {type: [string, number, 'null'], description: '**不落库**，用于三项加总自校验；不平则落 exception_kind=other + critical 告警，但金额照实入库'}
        products:
          type: array
          items:
            type: object
            properties:
              asin: {type: [string, 'null']}
              quantity: {type: [integer, 'null']}
              unitPrice: {type: [string, number, 'null'], description: 图纸未指定落点，**不落库**、不自造落点}
              totalPrice: {type: [string, number, 'null']}
              productImage: {type: [string, 'null']}
        execMode: {type: [string, 'null'], enum: [dry_run, stop_before_payment, live, null], description: fork 新增的回声字段；与实例当前档不符即 409（防插件版本落后按旧档跑）}
    PluginTrackingIn:
      type: object
      description: 物流回填体。**主键叫 orderId 不是 id**（厂商这一组就这么发）。trackingJson 是 **JSON 编码的字符串**不是数组。
      required: [orderId]
      properties:
        orderId: {type: integer, description: procurement_order.id}
        trackingNumber: {type: [string, 'null']}
        carrier: {type: [string, 'null']}
        trackingJson: {type: [string, 'null'], description: '事件数组的 JSON 字符串；元素含 day/time/tracking_info/city/state，**倒序（index 0 = 最新）**'}
        trackingUrl: {type: [string, 'null'], description: '**接收后立即丢弃**，不落任何列（可重抓、无消费者）'}
        trackingHtml: {type: [string, 'null'], description: '**接收后立即丢弃**：base64 整页 HTML，万单 GB 级，图纸 07:245-247 的明确不做决定'}
        receiptPicture: {type: [string, 'null'], description: '**接收后立即丢弃**'}
        mainPostCode: {type: [string, 'null']}
        extPostCode: {type: [string, 'null']}
        card: {type: [string, 'null'], description: 卡号后四位，仅在端点 2 未落时补空洞}
        asins: {type: [string, 'null']}
        orderDate: {type: [string, 'null']}
        subtotal: {type: [string, number, 'null']}
        shipping: {type: [string, number, 'null']}
        totalBeforeTax: {type: [string, number, 'null']}
        tax: {type: [string, number, 'null']}
        total: {type: [string, number, 'null']}
        deliveryDate: {type: [string, 'null']}
        origDeliveryDate: {type: [string, 'null']}
    Purchaser:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        purchaser_kind: {type: string}
        user_id: {type: [integer, 'null']}
        exchange_rate: {type: number}
        settle_currency: {type: string}
        status: {type: string}
        has_portal_account: {type: boolean}
    PortalProcurement:
      type: object
      description: 门户白名单字段（对应 portal_procurement_v；无 team/store/客户身份信息）
      properties:
        id: {type: integer}
        status: {type: string}
        item_summary:
          type: array
          items:
            type: object
            properties:
              channel_sku: {type: string}
              qty: {type: integer}
              unit_price: {type: number}
        ship_to: {type: object}
        purchase_platform: {type: [string, 'null']}
        purchase_order_ref: {type: [string, 'null']}
        purchase_cost: {type: [number, 'null']}
        freight_cost: {type: [number, 'null']}
        carrier: {type: [string, 'null']}
        tracking_no: {type: [string, 'null']}
        claimed_at: {type: [string, 'null'], format: date-time}
    PortalProcurementPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/PortalProcurement'}}}}
    Notification:
      type: object
      properties:
        id: {type: integer}
        severity: {type: string}
        category: {type: string}
        title: {type: string}
        body: {type: [string, 'null']}
        object_type: {type: [string, 'null']}
        object_id: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
    NotificationPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Notification'}}}}

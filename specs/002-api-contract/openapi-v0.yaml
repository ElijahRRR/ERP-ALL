  # ──────────────────────── Order ────────────────────────
  /orders:
    get:
      tags: [Order]
      x-permission: order.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: store_id, in: query, schema: {type: integer}}
        - {name: internal_status, in: query, schema: {type: string}}
        - {name: has_flag, in: query, schema: {type: boolean}}
        - {name: order_after, in: query, schema: {type: string, format: date-time}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OrderPage'}}}}}
  /orders/{orderId}:
    get:
      tags: [Order]
      summary: 订单详情（内嵌 lines + checks + procurement 摘要）
      x-permission: order.read
      parameters: [{$ref: '#/components/parameters/orderId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/OrderDetail'}}}}}
  /orders/{orderId}/checks/rerun:
    post:
      tags: [Order]
      summary: 重跑四检
      x-permission: order.check
      parameters: [{$ref: '#/components/parameters/orderId'}]
      responses: {'200': {description: OK}}
  /orders/{orderId}/checks/{checkKind}/resolve:
    post:
      tags: [Order]
      summary: 人工放行 flagged 检查项
      x-permission: order.check
      parameters:
        - {$ref: '#/components/parameters/orderId'}
        - {name: checkKind, in: path, required: true, schema: {type: string, enum: [phishing, purchaser, price_limit, consistency]}}
      responses: {'200': {description: OK}}
  /orders/{orderId}/ship:
    post:
      tags: [Order]
      summary: 发货回传（异步推渠道；行级）
      x-permission: order.ship
      parameters: [{$ref: '#/components/parameters/orderId'}, {$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lines, carrier, tracking_no]
              properties:
                lines: {type: array, items: {type: object, required: [line_no, qty], properties: {line_no: {type: string}, qty: {type: integer}}}}
                carrier: {type: string}
                tracking_no: {type: string}
                procurement_order_id: {type: integer}
      responses: {'202': {description: 已入队推送}}
  /procurement-orders:
    get:
      tags: [Order]
      x-permission: procurement.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string}}
        - {name: purchaser_id, in: query, schema: {type: integer}}
        - {name: mine, in: query, schema: {type: boolean}, description: 内部采购执行入口「我的单」（D-Q50①）}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ProcurementPage'}}}}}
    post:
      tags: [Order]
      summary: 从订单建执行单（默认 unassigned；可直接带 purchaser_id 分配）
      x-permission: order.assign
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id: {type: integer}
                purchaser_id: {type: integer}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ProcurementOrder'}}}}}
  /procurement-orders/{poId}/assign:
    post:
      tags: [Order]
      summary: 指派执行单（二选一：人工采购方 purchaser_id / 买家账号 buyer_account_id）
      description: >-
        〔17d，D-Q73〕自动派发休眠后，`buyer_account_id` 是插件路径的**唯一派发入口**：
        指派后插件按 customerId 拉到该单。两个目标恰好给一个，都给/都不给 ⇒ 422；
        与另一路在途互斥（先 /release 才能换道，409）。
      x-permission: order.assign
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purchaser_id: {type: [integer, 'null']}
                buyer_account_id: {type: [integer, 'null'], description: 17d 人工指派给买家账号（插件路径）}
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/Error'}}
  /procurement-orders/{poId}/claim:
    post:
      tags: [Order]
      summary: 内部领单（D-Q50① 权限点入口）
      x-permission: procurement.execute
      parameters: [{$ref: '#/components/parameters/poId'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/Error'}}
  /procurement-orders/{poId}/backfill:
    post:
      tags: [Order]
      summary: 回填采购与物流（内部全字段；运营代填走同端点 op_direct 语义）
      x-permission: procurement.execute
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody: {$ref: '#/components/requestBodies/ProcurementBackfill'}
      responses: {'200': {description: OK}}
  /procurement-orders/{poId}/release:
    post:
      tags: [Order]
      # R2-13 审查 A3：插件异常单的**显式出边**（0045 头注二承诺、此前代码里不存在）。
      # 不给出边则 uq_po_active_dispatch 长期占着该 order_id，该渠道订单再也派不出去，
      # 人工侧又被 PROCUREMENT_PLUGIN_DISPATCHED 挡住 —— 单卡死。
      # 权限点取 order.assign（改的是「这单归谁做」，同建单/分配），不是 procurement.execute。
      summary: 把插件异常单释放回待派池（清 buyer_account_id / 异常分类与原文，订单退回 checked）
      description: |
        仅接受**插件派发单**（buyer_account_id 非空）且 status='exception' 且尚未拍成单
        （purchase_order_ref 与 purchased_at 均为空）。三条守卫各自 409：
        - `PROCUREMENT_NOT_PLUGIN_DISPATCHED`：人工采购方的异常单不走本出边（FX-0730B）
        - `PROCUREMENT_STATE_INVALID`：插件仍在执行（assigned/claimed）的单不许把活抽走
        - `PROCUREMENT_ALREADY_PURCHASED`：已有单号/拍单时刻 —— 释放会被重新派发＝二次扣款
      x-permission: order.assign
      parameters: [{$ref: '#/components/parameters/poId'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/Error'}}
  /procurement-orders/{poId}/plugin-backfill:
    post:
      tags: [Order]
      # Owner 2026-07-31 裁定（异常 #16 口径）：人工补录 = 先去亚马逊买家号核实确有
      # 这条购买记录，再把单号手填进来。插件端点 2 重试仍是主通道（一般能自动查到），
      # 本端点是实例失联时的人工兜底。与 /backfill 是两个语义：那边人买人填推 backfilled，
      # 这边插件买人代抄，按插件路径落 purchased（D5），物流链随插件端点 7 继续。
      # 与 /release 互斥成对：查到记录→补录（落 ref 后 release 守卫 3 自动拒绝）；
      # 确认没有→释放回池。
      summary: 人工补录插件单的已发生购买（异常 #16 兜底；落 purchased，主体 op_direct）
      description: |
        仅接受**插件派发单**（buyer_account_id 非空）且 status ∈ assigned/exception
        且尚无 purchase_order_ref。三条守卫各自 409：
        - `PROCUREMENT_NOT_PLUGIN_DISPATCHED`：人工采购的回填走 /backfill
        - `PROCUREMENT_STATE_INVALID`：插件已回传过的单不需要补录
        - `PROCUREMENT_ALREADY_PURCHASED`：已有单号——与所查不一致属重复下单形状，标异常勿覆盖
        补录同时清 exception_kind/exception_reason（处置完毕，陈旧分类不留），
        渠道订单推进 checked→purchasing。
      x-permission: procurement.execute
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchase_order_ref]
              properties:
                purchase_order_ref: {type: string, minLength: 1, maxLength: 64}
                purchase_cost: {type: number, minimum: 0}
                tax_amount: {type: number, minimum: 0}
                freight_cost: {type: number, minimum: 0}
                payment_card_last4: {type: string, pattern: '^\d{4}$'}
      responses: {'200': {description: 'OK（{id, status=purchased}）'}, '409': {$ref: '#/components/responses/Error'}}
  /procurement-orders/{poId}/exception:
    post:
      tags: [Order]
      x-permission: procurement.execute
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
                # R2-13 0045：问题分类。不传 = 保持已有分类（coalesce 语义），不会抹成 null。
                kind:
                  type: string
                  enum: [address, stock, product, delivery, checkout, price_guard, channel_cancelled, order_not_found, other]
      responses: {'200': {description: OK}}
  /purchasers:
    get:
      tags: [Order]
      x-permission: procurement.read
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Purchaser'}}}}}}
    post:
      tags: [Order]
      summary: 建采购方（external 同步开 portal 账号，D-Q27/50）
      x-permission: procurement.admin
      requestBody: {$ref: '#/components/requestBodies/PurchaserWrite'}
      responses: {'201': {description: Created}}
  /purchasers/{purchaserId}:
    patch:
      tags: [Order]
      summary: 改采购方（含汇率，D-Q32；改汇率只影响未锁单）
      x-permission: procurement.admin
      parameters: [{name: purchaserId, in: path, required: true, schema: {type: integer}}]
      requestBody: {$ref: '#/components/requestBodies/PurchaserWrite'}
      responses: {'200': {description: OK}}
    delete:
      tags: [Order]
      summary: 硬删除采购方（00-conventions §7.1 + §7.1.1；R2-14 14b）
      description: >-
        §7.1.1(c)：删除前把该采购方名下**未锁汇率**（`exchange_rate_locked IS NULL`）的
        非终态执行单**退回 unassigned 并清空 purchaser_id**（汇率源随主体消失），渠道订单
        `internal_status` 对称退回 `checked`；退回后仍有**非终态**单（已锁汇率、执行中）
        → 409 拒删（在途守卫——删掉执行方会让门户失单、exception 单无法重分配）。
        终态（backfilled/cancelled）单一行不删、`purchaser_id` 原值保留（软引用），
        经墓碑解析显示「XX（已删除）」。有残留引用 = ②级写墓碑；无 = ①级直删。
        回执带 `orders_returned` / `orders_retained`。
      x-permission: procurement.purchaser_delete
      parameters:
        - {name: purchaserId, in: path, required: true, schema: {type: integer}}
        - name: reason
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
          description: 删除原因，写入墓碑与 audit_log
      responses:
        '200':
          description: 已删除
          content: {application/json: {schema: {$ref: '#/components/schemas/PrincipalDeleteResult'}}}
        '404': {description: 'PURCHASER_NOT_FOUND', $ref: '#/components/responses/Error'}
        '409': {description: 'PURCHASER_DELETE_IN_FLIGHT（退回未锁汇率单后仍有执行中的已锁汇率单——等其回填完结再删；若含 exception 单：人工处置通道未建成（FX-0730B），落地前暂无法删除）', $ref: '#/components/responses/Error'}

  # ──── 买家账号池 + 采购插件实例（R2-13 13b；图纸 07:249-286 + 288-340 身份模型更正）────
  # 与 purchaser 并列同 tag：买家账号是「谁去亚马逊下单」的另一种形态，同一类运营对象。
  # 权限三分（0043）：读 buyer_account_read / 改账号 buyer_account_admin /
  # **签发与吊销实例单列 plugin_instance_admin**——签发 = 发一个能代表本团队真下单的
  # 凭证，与「改个备注名」不是同一量级。**本组无 DELETE 端点**：买家账号的删除分支挂在
  # 14b 之后另补（0043 头注：授 DELETE 必须同时建 DELETE 策略，且要处置该账号名下在途单）。
  # 「删不掉」与「驳回是终态」互为因果——正因为删不掉，驳回才必须粘住（见 PATCH 说明）。
  #
  # **两段式身份**（本轮更正）：`plugin_instance` 的令牌绑「一台授权浏览器」，回答
  # 「这是不是团队 T 的授权浏览器」；`buyer_account` 由插件每次带上来的 `customerId`
  # 在团队 T 内解析，回答「这台浏览器此刻登的是哪个买家号」。故实例端点是**团队级**，
  # 而账号的产生方式是**首见自动登记**（不是人工预录入——那会造成「装插件前先要知道
  # customerId、而 customerId 只有装了插件才看得到」的死循环）。
  /buyer-accounts:
    get:
      tags: [Order]
      summary: 买家账号池列表（服务端分页）
      x-permission: procurement.buyer_account_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: site, in: query, schema: {type: string, enum: [amazon_com, amazon_ca, amazon_co_jp]}}
        - {name: status, in: query, schema: {type: string, enum: [pending_claim, active, paused, blocked, retired, rejected]}, description: 'pending_claim=插件首见自动登记的待认领行（一律不派单）；rejected=已驳回终态'}
        # 默认折叠 rejected，与 14c 产品页折叠 retired 同一做法（`GET /products` 的 include_retired）：
        # 驳回是终态且**不删行**（本表无 DELETE 授权，粘性即治理），被灌过伪造 customerId 的团队
        # 池子里会长期躺着一堆已驳回行。**显式传 status 时本参数不生效**——运营在下拉里选「已驳回」
        # 必须真能看到它们，否则看起来就是功能坏了。
        - {name: include_rejected, in: query, schema: {type: boolean, default: false}, description: '是否包含已驳回（rejected）行；默认折叠。显式传 status 时本参数不生效'}
        - {name: q, in: query, schema: {type: string}, description: 按 label 模糊搜索}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/BuyerAccountPage'}}}}}
    post:
      tags: [Order]
      summary: 建买家账号（可选预建捷径）
      description: >-
        **主路径是首见自动登记，不是本端点**（身份模型更正，Owner 2026-07-30，图纸 07:288-340）：
        让插件在那台浏览器上跑一次拉取，服务端把它带上来的 `customerId` 落成一条
        `status=pending_claim` 的待认领行并通知，运营补齐 `label`/`site`(/`daily_cap`)
        后走 `PATCH /buyer-accounts/{id}` 认领。本端点只在运营手上**已经**有 customerId
        时省一轮往返。`external_customer_id` 在本端点仍必填——一条解析不到的账号行永远
        收不到任务；不知道 customerId 时的正解是走主路径，不是在这里留空。
        `label` 的语义 = 对应哪个指纹浏览器（07:258）。


        **`status` 只收人工可选的四值**（`active`/`paused`/`blocked`/`retired`）——
        `pending_claim` 与 `rejected` 是**系统态**，本端点一律 422：前者由插件首见自动
        登记独家产生（手工建一条等于伪造一个从未发生的"发现"），后者只能从待认领行驳回
        而来（直接建出来即是一条改不动也删不掉的死行——终态 + 无 DELETE 授权）。
        PATCH 侧对应的是「任何态都不许转回 `pending_claim`」；两处一起才封住这两个系统态。
      x-permission: procurement.buyer_account_admin
      requestBody: {$ref: '#/components/requestBodies/BuyerAccountCreate'}
      responses:
        '201': {description: Created}
        '409': {description: 'BUYER_ACCOUNT_DUPLICATE（detail.field 指明撞的是 external_customer_id 还是 label）', $ref: '#/components/responses/Error'}
        '422': {description: 'BUYER_ACCOUNT_FIELDS_REQUIRED（label/site/external_customer_id 缺项）/ BUYER_ACCOUNT_STATUS_NOT_CREATABLE（status 填了系统态 pending_claim 或 rejected）', $ref: '#/components/responses/Error'}
  /buyer-accounts/{buyerAccountId}:
    patch:
      tags: [Order]
      summary: 改买家账号（含**认领 / 驳回**：label/site/status/daily_cap/note/external_customer_id）
      description: >-
        `daily_cap` **显式传 null = 改成不限**（不传 = 不动该列）。日限的唯一权威就是本列
        ——`automation_policy` 的 flow config 里不得出现同名键（Owner 2026-07-30 裁定）。


        **认领与驳回也走本端点**（不另开路由、不另加权限码）：

        - 认领 `pending_claim → active`：必须**同时**补齐 `label` 与 `site`，缺则 422
          `BUYER_ACCOUNT_CLAIM_INCOMPLETE`（库层 `ck_buyer_account_claimed` 兜底——
          「active 但没站点」不可表示，否则美国号会收到加拿大单）。审计动作名 `buyer_account.claim`。
        - 驳回 `pending_claim → rejected`：**终态**。不删行是刻意的（本表无 DELETE 授权），
          该 customerId 被 `uq_buyer_account` 永久占住 ⇒ 同一个伪造 id 再灌只会解析到那一行，
          零新增行、零新通知。审计动作名 `buyer_account.reject`。
        - `rejected → *` 与**任何态 → `pending_claim`** 一律 409 `BUYER_ACCOUNT_STATUS_TRANSITION`
          （待认领是系统发现态，不是运营可选态）。
        - **结果态为 `rejected` 的请求不许挪动 `external_customer_id`** ⇒ 409
          `BUYER_ACCOUNT_REJECTED_IMMUTABLE`——既拦已驳回行的后续修改，也拦「驳回 + 改 id
          合并成同一次 PATCH」的形状（整个请求原子拒绝，不做部分放行）。粘性靠「唯一索引
          占着那个值」成立，把值改走等于当场撤销驳回（此后同一个伪造 id 再灌又是"没见过"，
          新增行 + 新通知）。其余列（label/note/daily_cap）照常可改；原样带回同一个值是
          no-op，不报错——「整表单回填 + 驳回」一次请求照常 200。
      x-permission: procurement.buyer_account_admin
      parameters: [{$ref: '#/components/parameters/buyerAccountId'}]
      requestBody: {$ref: '#/components/requestBodies/BuyerAccountWrite'}
      responses:
        '200': {description: OK}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'BUYER_ACCOUNT_DUPLICATE / BUYER_ACCOUNT_STATUS_TRANSITION（非法状态转移）/ BUYER_ACCOUNT_REJECTED_IMMUTABLE（结果态为 rejected 的请求挪动 external_customer_id，含驳回+改 id 合并的形状）', $ref: '#/components/responses/Error'}
        '422': {description: 'BUYER_ACCOUNT_CLAIM_INCOMPLETE（认领时缺 label 或 site）', $ref: '#/components/responses/Error'}
  # 实例端点是**团队级**的（身份模型更正，Owner 2026-07-30，图纸 07:288-340）：
  # 令牌绑「一台授权浏览器」，不绑买家账号。旧的 `/buyer-accounts/{id}/plugin-instances`
  # 两条已**删除而不是保留**——那个形状本身就是「先有账号才能发令牌」的死循环
  # （装插件前先要知道 customerId，而 customerId 只有装了插件才看得到）。
  /plugin-instances:
    get:
      tags: [Order]
      summary: 本团队的插件实例列表（服务端分页）
      description: >-
        **响应不含 token 的任何形态（含 hash）**——明文只在签发响应出现一次。
        `last_seen_customer_id` 及随之 JOIN 出来的 `last_seen_account_label` /
        `last_seen_account_status` 是**观察值，不参与鉴权**（0044 头注六）：它们回答排障
        问题「这台机器现在登的是哪个号、认领了没有」。
      x-permission: procurement.buyer_account_read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [active, revoked]}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PluginInstancePage'}}}}}
    post:
      tags: [Order]
      summary: 签发实例令牌（团队级；明文只返回这一次）
      description: >-
        **不收买家账号**：令牌绑一台授权浏览器，装插件时还不知道那台浏览器会登哪个买家号。
        插件侧只需配置 `token` 与 `baseUrl` 两项——**ERP 侧契约不要求插件存储任何身份**
        （`customerId` 由插件每次从亚马逊页面现抓并随请求带上）。
        新签发的实例默认 `exec_mode=stop_before_payment`——**不会花钱**；升到 `live` 是一次
        显式 PATCH 且有 audit 留痕。故**本端点不接受 `live`**（枚举只有两个演练档，传 live 一律 422）
        ——只把 live 定成「非默认值」挡不住一步直签，那条不变量得由校验器执行。
        令牌明文**只在本响应里出现一次**，此后 ERP 侧任何端点（含本组的 GET）都取不到，
        遗失只能吊销后重新签发。
      x-permission: procurement.plugin_instance_admin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exec_mode: {type: string, enum: [dry_run, stop_before_payment], default: stop_before_payment}
                version: {type: string}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/PluginInstanceIssued'}}}}
        '409': {description: 'TEAM_REQUIRED（当前主体没有团队——超管未切换到具体团队。令牌绑定的就是「团队 T 的一台授权浏览器」，无团队的令牌解析不出任何任务）', $ref: '#/components/responses/Error'}
        '422': {description: '签发档位不合法（含 `exec_mode=live`——升 live 只能走 PATCH）', $ref: '#/components/responses/Error'}
  /plugin-instances/{pluginInstanceId}:
    patch:
      tags: [Order]
      summary: 改执行档（只此一项可改）
      description: >-
        切到 `live` 意味着该实例此后真实下单花钱——前端须二次确认，服务端写 audit。
        **本端点是升到 `live` 的唯一入口**：签发端点的枚举里没有 live。
      x-permission: procurement.plugin_instance_admin
      parameters: [{$ref: '#/components/parameters/pluginInstanceId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [exec_mode]
              properties:
                exec_mode: {type: string, enum: [dry_run, stop_before_payment, live]}
      responses:
        '200': {description: OK}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: 'PLUGIN_INSTANCE_REVOKED（已吊销的实例不可改档，请重新签发）', $ref: '#/components/responses/Error'}
  /plugin-instances/{pluginInstanceId}/revoke:
    post:
      tags: [Order]
      summary: 吊销实例（UPDATE 不是 DELETE）
      description: >-
        吊销后该令牌对全部插件端点一律 401。已吊销的再调一次是 no-op（200，不报错）。
        不做物理删除：历史实例 id 还挂在 `procurement_order.backfill_actor_id` 上
        （`backfill_actor_kind='plugin'` 时解读为实例 id），删行会让「这单谁填的」失去落点。
      x-permission: procurement.plugin_instance_admin
      parameters: [{$ref: '#/components/parameters/pluginInstanceId'}]
      responses:
        '200': {description: OK}
        '404': {$ref: '#/components/responses/Error'}

  # ──────────────────────── Aftersale（R2-07）────────────────────────
  /returns:
    get:
      tags: [Aftersale]
      summary: 退货单列表（RMA 头级；行级状态见详情）
      x-permission: aftersale.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: store_id, in: query, schema: {type: integer}}
        - {name: internal_status, in: query, schema: {type: string, enum: [pulled, reviewed, closed]}}
        - {name: return_after, in: query, schema: {type: string, format: date-time}}
        - {name: q, in: query, schema: {type: string}, description: RMA / 客户订单号 精确查}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReturnPage'}}}}}
  /returns/{returnId}:
    get:
      tags: [Aftersale]
      summary: 退货单详情（内嵌 lines + 行级状态变更 events）
      x-permission: aftersale.read
      parameters: [{$ref: '#/components/parameters/returnId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReturnDetail'}}}}}
  /refund-requests:
    get:
      tags: [Aftersale]
      x-permission: aftersale.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [recorded, pending_approval, approved, rejected, executing, executed, failed]}}
        - {name: kind, in: query, schema: {type: string, enum: [cancel, refund]}}
        - {name: order_id, in: query, schema: {type: integer}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequestPage'}}}}}
    post:
      tags: [Aftersale]
      summary: 创建退款/取消申请（档位随建快照 D-Q29；auto 档 R2-09 接线前拒绝）
      x-permission: refund.request
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_id, kind, amount, reason_code]
              properties:
                order_id: {type: integer}
                kind: {type: string, enum: [cancel, refund]}
                amount: {type: number, exclusiveMinimum: 0}
                reason_code: {type: string, description: sys_dict(refund_reason)}
                reason_text: {type: [string, 'null']}
                lines: {type: array, items: {type: object, required: [line_no, qty, amount], properties: {line_no: {type: string}, qty: {type: integer}, amount: {type: number}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequest'}}}}}
  /refund-requests/{refundRequestId}/approve:
    post:
      tags: [Aftersale]
      summary: 审批通过（approval 档；approved 驻留待 R2-09 执行接线）
      x-permission: refund.approve
      parameters: [{$ref: '#/components/parameters/refundRequestId'}]
      responses: {'200': {description: OK}}
  /refund-requests/{refundRequestId}/reject:
    post:
      tags: [Aftersale]
      summary: 审批拒绝（approval 档）
      x-permission: refund.approve
      parameters: [{$ref: '#/components/parameters/refundRequestId'}]
      responses: {'200': {description: OK}}

  # ──────────────────── Automation（R2-09 增量2 自动化档位面板）────────────────────
  /automation-policies:
    get:
      tags: [Automation]
      summary: 自动化档位总览（注册表 ∪ 本团队行；无行的 flow 也返回 state=unset，恒 10 条）
      x-permission: automation.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AutomationPolicy'}}
        '422': {description: 超管未带 X-Act-Team（AUTOMATION_TEAM_REQUIRED）——不按 team_id=NULL 静默查，那会返回一屏描述「没有团队」的假面板, $ref: '#/components/responses/Error'}
  /automation-policies/{flowCode}:
    put:
      tags: [Automation]
      summary: 置本团队某 flow 的档位（全量置态 upsert；表无 DELETE 授权，关闭=enabled false 或 manual）
      x-permission: automation.write
      parameters: [{$ref: '#/components/parameters/flowCode'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, enabled]
              properties:
                mode: {type: string, description: 必须是 manual/semi/auto 之一；enabled=true 时还须属于该 flow 的 legal_modes（闸类只有 manual/auto），否则 422 AUTOMATION_MODE_ILLEGAL。enabled=false 时放宽到三档任一——停用一条已存非法档位的行必须走得通（停用是收紧）}
                enabled: {type: boolean, description: 必填（审查 N2）——此前可省略且默认 true，对停用行只发 mode 会静默复启，落在 refund/cancel 上是真钱不可逆；schema 必须与「全量置态整对提交」一致}
                config: {type: [object, 'null'], additionalProperties: true, description: 恒拒绝（422 AUTOMATION_CONFIG_NOT_WRITABLE）——全仓零消费点，写入只会造成「护栏已配」的错觉；显式接住再拒绝以走统一错误信封}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/AutomationPolicy'}}}}
        '404': {description: flow_code 不在 §09 注册表（AUTOMATION_FLOW_UNKNOWN）, $ref: '#/components/responses/Error'}
        '422': {description: 档位取值或对该 flow 非法（AUTOMATION_MODE_ILLEGAL）/ 带 config（AUTOMATION_CONFIG_NOT_WRITABLE）/ 超管未带 X-Act-Team（AUTOMATION_TEAM_REQUIRED）。注：缺 mode/enabled 字段等请求体结构违例走 FastAPI 默认 detail 信封，全仓皆然（002 既有缺口，另行提单）, $ref: '#/components/responses/Error'}

  # ──────────────────────── Portal ────────────────────────
  /portal/auth/login:
    post:
      tags: [Portal]
      security: []
      summary: 门户登录（独立账号表 portal_account，JWT audience=portal）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}}
  /portal/procurement-orders:
    get:
      tags: [Portal]
      security: [{portalAuth: []}]
      summary: 我的执行单（仅 assigned/claimed/purchased/shipped；视图白名单字段）
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [assigned, claimed, purchased, shipped]}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProcurementPage'}}}}}
  /portal/procurement-orders/{poId}:
    get:
      tags: [Portal]
      security: [{portalAuth: []}]
      parameters: [{$ref: '#/components/parameters/poId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProcurement'}}}}}
  /portal/procurement-orders/{poId}/claim:
    post:
      tags: [Portal]
      security: [{portalAuth: []}]
      parameters: [{$ref: '#/components/parameters/poId'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/Error'}}
  /portal/procurement-orders/{poId}/backfill:
    post:
      tags: [Portal]
      security: [{portalAuth: []}]
      summary: 门户回填（受限列：采购平台/单号/成本/物流）
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody: {$ref: '#/components/requestBodies/ProcurementBackfill'}
      responses: {'200': {description: OK}}
  /portal/procurement-orders/{poId}/exception:
    post:
      tags: [Portal]
      security: [{portalAuth: []}]
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string}}
      responses: {'200': {description: OK}}

  # ───────────────────────── Notify ─────────────────────────
  # 通知中心：任何登录用户可用，**无权限点**（`notify/router.py:1` docstring 即此口径），
  # 故这四条不带 x-permission。前端通知铃/通知中心页在用（此前手写响应类型，属 FE-DEBT）。
  /notifications:
    get:
      tags: [Notify]
      summary: 通知列表（分页）
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: unread_only, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}
  /notifications/unread-count:
    get:
      tags: [Notify]
      summary: 未读数（铃铛轮询）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [count], properties: {count: {type: integer}}}
  /notifications/read-all:
    post:
      tags: [Notify]
      summary: 全部标记已读
      responses:
        '204': {description: No Content}
  /notifications/{notificationId}/read:
    post:
      tags: [Notify]
      summary: 单条标记已读
      parameters:
        - {name: notificationId, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: No Content}

  # ───────────────────── ScrapeWorker（采集节点） ─────────────────────
  # **路径里的双版本号 `/api/v1/worker/v1/…` 是如实登记、不是笔误**：`worker_router` 自带
  # `prefix=/worker/v1`（`scrape/router.py:26`）又被挂在 `/api/v1` 下叠出来的。改路径是破坏性
  # 的（采集 worker 在跑），故保留现状并在此照实写明。
  # 认证走**第三个域**：`X-Node-Key` + `X-Node-Token` 双头部（非 JWT、无权限点）。
  # `register` 用一次性 enroll_token 换取长期凭证，因此它本身不带 node 认证。
  /worker/v1/register:
    post:
      tags: [ScrapeWorker]
      security: []
      summary: 节点注册（以 enroll_token 换取长期凭证）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_key, kind, enroll_token]
              properties:
                node_key: {type: string, minLength: 3, maxLength: 64}
                kind: {type: string, enum: [scraper_amazon, scraper_walmart]}
                enroll_token: {type: string}
                version: {type: [string, 'null']}
                capacity: {type: integer, minimum: 1, maximum: 64, default: 1}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object}}}}
  /worker/v1/sync:
    post:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 节点心跳与状态上报
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: [string, 'null']}
                metrics: {type: object}
                window_state: {type: object}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object}}}}
  /worker/v1/tasks/pull:
    get:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 认领采集任务
      parameters:
        - {name: count, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [tasks], properties: {tasks: {type: array, items: {type: object}}}}
  /worker/v1/tasks/release:
    post:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 释放已认领任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  items: {type: object, properties: {task_id: {type: integer}, attempt: {type: integer}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [released], properties: {released: {type: integer}}}
  /worker/v1/tasks/result:
    post:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 回传采集结果
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt]
              properties:
                task_id: {type: integer}
                attempt: {type: integer}
                success: {type: boolean, default: true}
                payload: {type: [object, 'null']}
                payload_ref: {type: [string, 'null']}
                fetched_at: {type: [string, 'null'], format: date-time}
                error_type: {type: [string, 'null']}
                error_detail: {type: [string, 'null']}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object}}}}

  # ─────────────────── PurchasePlugin（Amazon 采购插件回调面，R2-13）───────────────────
  # ① **第四个认证域**：`X-Plugin-Token`（共享 token，D-Q73 17c）单头部，非 JWT、
  #    无 x-permission——同 ScrapeWorker，保护在另一条道上而不是没有保护。
  #    共享值来自 `ERP_PLUGIN_SHARED_TOKEN`（.env 一行，**未配置=通道整体关闭**）；
  #    团队归属/执行档位是业务参数，在 system_config（procurement.plugin_team_id /
  #    plugin_exec_mode）。失败一律 401 `PLUGIN_AUTH`，**不区分**「未配置 / 缺头 / 令牌错」。
  #    〔逐实例双头部链（X-Plugin-Instance + 签发/吊销仪式）保留休眠于
  #    `plugin/auth.py::authenticate_instance`，重启多机归因时换回 router 依赖并还原本段。〕
  # ② **路径末段保留厂商方法名（camelCase）是有意的**：本组是机器协议不是 UI 契约。
  #    13e 的回切演练要拿 fork 版与厂商原版逐条对照，路径逐字对应做到零翻译；
  #    且插件 `CONFIG.API.endpoints` 的键名与末段一一对应。前缀收成一组
  #    （厂商侧原本分 amazonOrder / amazonOrderPig 两个命名空间）是 Owner 2026-07-30 裁定。
  # ③ ⛔ **本组故意不含 `updateBuyerCookie`**（9 端点 − 它 − amazonOrderPig 那 2 条 = 6 条）。
  #    Owner 2026-07-30 二次裁定「先不收 cookie」，理由不是「暂时不用」而是**用途已被证伪**：
  #    那份 jar 的字段整形正是 Cookie-Editor 类插件的导出格式，唯一目的是被导入回浏览器
  #    ——它是整套可搬运的登录态而非标识；「哪个买家号」由同一调用的 `customerId` 承载。
  #    ERP 侧不建路由、不建 `buyer_session` 表、任何 cookie jar 不落库。
  #    **契约门禁只查「代码有契约无」和「契约有代码无」，不会替我们记住「故意不做」**，故写在此处。
  # ④ **`getNeedSyncOrders` 的响应字段未逐字取证**（考古只对端点 1 给了逐字段清单，
  #    `archaeology.md:24`）。此处按最小集声明；fork 时以插件 `handleOrderSync` 实读为准，
  #    如有出入**以插件为准并同 PR 修本契约**。不许编字段。
  # ⑤ 成功响应一律 `{code: 200, data: ...}`（厂商兼容信封，插件读 `response.data`）；
  #    **失败走本仓统一 ErrorResponse + 真实 HTTP 状态码**，绝不做「HTTP 200 里塞 code:500」。
  # ⑥ **写回四端点（2/3/4/7）的请求体不带 `customerId`**——厂商协议如此，已逐字取证
  #    （`.agent/evidence/R2-13/owner-reverse-engineering-20260730.md` C.2/E.2）。故它们的归属
  #    检查是「**团队** + 是不是插件派发单」，**不是**身份一致性。这条写进契约是为了挡住
  #    下一个人「那就给插件加个 customerId 参数」的念头：ERP 侧契约**不得要求插件存储或
  #    上报任何 per-install 身份**（插件源码实测零 per-install 配置，customerId 每次从
  #    亚马逊页面现抓）。同团队、派给另一个账号的单**放行**是有意的——换号之后那笔已经
  #    花出去的钱必须报得回来。
  /purchase-plugin/getNeedPurchaseOrders:
    get:
      tags: [PurchasePlugin]
      security: [{pluginTokenAuth: []}]
      summary: 拉待采购任务（拉取即认领）
      description: >-
        **GET 但有副作用**：本端点把 `customerId` 在**本团队范围内**解析成买家账号，
        再按站点/日限/唯一派发把待采购单认领给它。重复调用幂等——已认领给该账号的单会再次
        返回，不产生新派发、不重复消耗 `daily_cap`（插件重启/掉线后必须还能看见手上的单）。


        `customerId` 是**路由参数不是鉴权凭据**（身份模型更正，图纸 07:288-340）：
        令牌回答「这是不是团队 T 的一台授权浏览器」，`customerId` 回答「这台浏览器此刻登的
        是哪个买家号」。越权边界＝**跨团队必败**，由 `plugin_instance.team_id` + RLS +
        每条 SQL 的显式 `team_id = :t` 承担。


        **未认领 / 从没见过 / 跨团队一律 `200` + 空数组**（响应逐字节同形，不泄漏存在性——
        任何差异化处理本身就是存在性探针）。本团队没见过的 `customerId` 会**自动落一条
        `status=pending_claim` 的账号行并通知**，运营认领后才开始派单；`pending_claim` 与
        `rejected` 一律不派单。待认领行数有上限（配置键 `procurement.plugin_dispatch`
        的 `pending_claim_cap`），撞上限则**不登记**并发 critical 告警，响应仍同形。
        账号 `status` 非 `active` 时本端点返回空（写路径不受影响）。
      parameters:
        - {name: customerId, in: query, required: true, schema: {type: string, maxLength: 64}, description: '插件从亚马逊页面现抓的买家号标识。服务端在本团队范围内解析成 buyer_account；**不是鉴权凭据**'}
        - {name: v, in: query, schema: {type: string, maxLength: 40}, description: 插件版本（选填），回写 plugin_instance.version}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: {type: integer, enum: [200], description: 厂商兼容回声，恒为 200}
                  data: {type: array, items: {$ref: '#/components/schemas/PluginTask'}}
        '401': {description: 'PLUGIN_AUTH（不区分原因）', $ref: '#/components/responses/Error'}
  /purchase-plugin/getNeedSyncOrders:
    get:
      tags: [PurchasePlugin]
      security: [{pluginTokenAuth: []}]
      summary: 拉待物流同步订单
      description: >-
        该 `customerId` 解析出的账号名下、已拍单（`purchased`/`shipped`）且有渠道单号的单。
        响应字段取证缺口见本组头注④。`customerId` 的语义与首见自动登记行为同端点 1
        （**路由参数，未认领/未知/跨团队一律 200 + 空数组**）。


        **本端点不设账号 status 闸**（与端点 1 的区别是刻意的）：它拉的是「已经买了、等物流」
        的单，账号被 `paused`/`blocked` 时**必须照常同步**——包裹在路上，钱已经花了。
      parameters:
        - {name: customerId, in: query, required: true, schema: {type: string, maxLength: 64}, description: 同端点 1：路由参数，非鉴权凭据}
        - {name: v, in: query, schema: {type: string, maxLength: 40}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [code, data]
                properties:
                  code: {type: integer, enum: [200]}
                  data: {type: array, items: {$ref: '#/components/schemas/PluginSyncOrder'}}
        '401': {$ref: '#/components/responses/Error'}
  /purchase-plugin/purchaseOrderFinishUpdate:
    post:
      tags: [PurchasePlugin]
      security: [{pluginTokenAuth: []}]
      summary: 采购完成回填（金额/单号/卡号后四位/预计送达）
      description: >-
        幂等键 = `platformOrderNo`（自然键，跨插件重装/换实例仍成立，**不用 Idempotency-Key**
        ——插件侧没有生成它的地方）。同值重投 = 200 no-op；**异值不覆盖原值**，改落
        `exception_kind=other` + critical 告警（那是重复下单的形状，必须让人看见）。
        `execMode` 与实例当前档不符回 409 `PLUGIN_EXEC_MODE_MISMATCH`。
        非本团队的插件派发任务回 403 `PLUGIN_TASK_NOT_OWNED`（与「id 不存在」同码同状态）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginBackfillIn'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {code: {type: integer, enum: [200]}, data: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'PLUGIN_TASK_NOT_OWNED（非本团队的插件派发任务；请求体不带 customerId，故这里判的是团队而不是身份——见组头注⑥）', $ref: '#/components/responses/Error'}
        '409': {description: PLUGIN_EXEC_MODE_MISMATCH, $ref: '#/components/responses/Error'}
  /purchase-plugin/updateOrderStatus:
    post:
      tags: [PurchasePlugin]
      security: [{pluginTokenAuth: []}]
      summary: 拍单失败（status=99）
      description: >-
        落 `status=exception` + `exception_reason`（failReason 原文一字不改）+
        `exception_kind`（17 条厂商原文的归类表，见 `plugin/classify.py`）。**零金额列写入**。
        `status` 只接受 99——厂商的数字状态机不进我方模型，其余值 422。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: {type: integer, description: procurement_order.id}
                status: {type: integer, enum: [99]}
                failReason: {type: [string, 'null'], description: 失败原文；服务端亦接受同义字段名 failContent（请求体键名未逐字取证，两名一义故都收）}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {code: {type: integer, enum: [200]}, data: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'PLUGIN_TASK_NOT_OWNED（非本团队的插件派发任务；请求体不带 customerId，故这里判的是团队而不是身份——见组头注⑥）', $ref: '#/components/responses/Error'}
  /purchase-plugin/updateAmzOrderStatus:
    post:
      tags: [PurchasePlugin]
      security: [{pluginTokenAuth: []}]
      summary: 渠道侧回报（91=已取消/退款，92=订单不存在）
      description: >-
        这两条发生在**已拍单之后**，故只落 `exception_kind`（`channel_cancelled` /
        `order_not_found`）+ critical 告警，**`status` 一律不动**——改成 exception 会抹掉
        「已拍单」这个事实，运营看到会以为没拍然后重拍一次。
        `orderNo` 只做一致性校验，不符仅记 warn 不拒（渠道单号漂移不该挡住「渠道取消了」入库）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id: {type: integer}
                orderNo: {type: [string, 'null']}
                status: {type: integer, enum: [91, 92]}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {code: {type: integer, enum: [200]}, data: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'PLUGIN_TASK_NOT_OWNED（非本团队的插件派发任务；请求体不带 customerId，故这里判的是团队而不是身份——见组头注⑥）', $ref: '#/components/responses/Error'}
  /purchase-plugin/updateTrackingInfo:
    post:
      tags: [PurchasePlugin]
      security: [{pluginTokenAuth: []}]
      summary: 物流回填（运单号 + 承运商 + 轨迹事件）
      description: >-
        主表金额四项走 `coalesce(列, 新值)`（端点 2 已落的是权威，本端点只补空洞）；
        `status` **只从 purchased 推到 shipped**，绝不从 assigned 跳（没拍单哪来的运单）。
        **绝不动 `channel_order.internal_status`**——那是「我方已发货给 Walmart 买家」，
        亚马逊侧包裹在路上 ≠ 我方已发货。
        轨迹事件写 `procurement_logistics_event`，`seq` = 渠道数组下标（**0 = 最新，整个数组倒序**）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginTrackingIn'}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object, properties: {code: {type: integer, enum: [200]}, data: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {description: 'PLUGIN_TASK_NOT_OWNED（非本团队的插件派发任务；请求体不带 customerId，故这里判的是团队而不是身份——见组头注⑥）', $ref: '#/components/responses/Error'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 内部 JWT（audience=erp）}
    portalAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 门户 JWT（audience=portal）}
    nodeKeyAuth: {type: apiKey, in: header, name: X-Node-Key, description: 采集节点标识（与 nodeTokenAuth 同时提供）}
    nodeTokenAuth: {type: apiKey, in: header, name: X-Node-Token, description: 采集节点令牌（`scrape/router.py::_node_auth` 双头部校验）}
    # 〔D-Q73 17c〕pluginInstanceAuth（X-Plugin-Instance 头）随逐实例链休眠摘除：fork 插件
    # 旧构建仍会发该头，FastAPI 对未声明的头自动忽略，无需兼容层。重启多机归因时放回。
    pluginTokenAuth: {type: apiKey, in: header, name: X-Plugin-Token, description: 采购插件共享令牌（`plugin/auth.py::authenticate_shared`；值=ERP_PLUGIN_SHARED_TOKEN，未配置则通道整体关闭；比较走 sha256+恒定时；D-Q73 17c——原「实例专属、禁全局共享密钥」纪律随单人模式经 Owner 裁定翻转，逐实例链保留休眠）}

  parameters:
    page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    idempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 64}}
    teamId: {name: teamId, in: path, required: true, schema: {type: integer}}
    userId: {name: userId, in: path, required: true, schema: {type: integer}}
    roleId: {name: roleId, in: path, required: true, schema: {type: integer}}
    storeId: {name: storeId, in: path, required: true, schema: {type: integer}}
    productId: {name: productId, in: path, required: true, schema: {type: integer}}
    listingId: {name: listingId, in: path, required: true, schema: {type: integer}}
    orderId: {name: orderId, in: path, required: true, schema: {type: integer}}
    poId: {name: poId, in: path, required: true, schema: {type: integer}}
    buyerAccountId: {name: buyerAccountId, in: path, required: true, schema: {type: integer}}
    pluginInstanceId: {name: pluginInstanceId, in: path, required: true, schema: {type: integer}}
    returnId: {name: returnId, in: path, required: true, schema: {type: integer}}
    refundRequestId: {name: refundRequestId, in: path, required: true, schema: {type: integer}}
    incidentId: {name: incidentId, in: path, required: true, schema: {type: integer}}
    assignmentId: {name: assignmentId, in: path, required: true, schema: {type: integer}}

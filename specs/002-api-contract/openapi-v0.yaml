      x-permission: procurement.execute
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody: {$ref: '#/components/requestBodies/ProcurementBackfill'}
      responses: {'200': {description: OK}}
  /procurement-orders/{poId}/exception:
    post:
      tags: [Order]
      x-permission: procurement.execute
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string}}
      responses: {'200': {description: OK}}
  /purchasers:
    get:
      tags: [Order]
      x-permission: procurement.read
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Purchaser'}}}}}}
    post:
      tags: [Order]
      summary: 建采购方（external 同步开 portal 账号，D-Q27/50）
      x-permission: procurement.admin
      requestBody: {$ref: '#/components/requestBodies/PurchaserWrite'}
      responses: {'201': {description: Created}}
  /purchasers/{purchaserId}:
    patch:
      tags: [Order]
      summary: 改采购方（含汇率，D-Q32；改汇率只影响未锁单）
      x-permission: procurement.admin
      parameters: [{name: purchaserId, in: path, required: true, schema: {type: integer}}]
      requestBody: {$ref: '#/components/requestBodies/PurchaserWrite'}
      responses: {'200': {description: OK}}

  # ──────────────────────── Aftersale（R2-07）────────────────────────
  /returns:
    get:
      tags: [Aftersale]
      summary: 退货单列表（RMA 头级；行级状态见详情）
      x-permission: aftersale.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: store_id, in: query, schema: {type: integer}}
        - {name: internal_status, in: query, schema: {type: string, enum: [pulled, reviewed, closed]}}
        - {name: return_after, in: query, schema: {type: string, format: date-time}}
        - {name: q, in: query, schema: {type: string}, description: RMA / 客户订单号 精确查}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReturnPage'}}}}}
  /returns/{returnId}:
    get:
      tags: [Aftersale]
      summary: 退货单详情（内嵌 lines + 行级状态变更 events）
      x-permission: aftersale.read
      parameters: [{$ref: '#/components/parameters/returnId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ReturnDetail'}}}}}
  /refund-requests:
    get:
      tags: [Aftersale]
      x-permission: aftersale.read
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [recorded, pending_approval, approved, rejected, executing, executed, failed]}}
        - {name: kind, in: query, schema: {type: string, enum: [cancel, refund]}}
        - {name: order_id, in: query, schema: {type: integer}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequestPage'}}}}}
    post:
      tags: [Aftersale]
      summary: 创建退款/取消申请（档位随建快照 D-Q29；auto 档 R2-09 接线前拒绝）
      x-permission: refund.request
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_id, kind, amount, reason_code]
              properties:
                order_id: {type: integer}
                kind: {type: string, enum: [cancel, refund]}
                amount: {type: number, exclusiveMinimum: 0}
                reason_code: {type: string, description: sys_dict(refund_reason)}
                reason_text: {type: [string, 'null']}
                lines: {type: array, items: {type: object, required: [line_no, qty, amount], properties: {line_no: {type: string}, qty: {type: integer}, amount: {type: number}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequest'}}}}}
  /refund-requests/{refundRequestId}/approve:
    post:
      tags: [Aftersale]
      summary: 审批通过（approval 档；approved 驻留待 R2-09 执行接线）
      x-permission: refund.approve
      parameters: [{$ref: '#/components/parameters/refundRequestId'}]
      responses: {'200': {description: OK}}
  /refund-requests/{refundRequestId}/reject:
    post:
      tags: [Aftersale]
      summary: 审批拒绝（approval 档）
      x-permission: refund.approve
      parameters: [{$ref: '#/components/parameters/refundRequestId'}]
      responses: {'200': {description: OK}}

  # ──────────────────────── Portal ────────────────────────
  /portal/auth/login:
    post:
      tags: [Portal]
      security: []
      summary: 门户登录（独立账号表 portal_account，JWT audience=portal）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TokenPair'}}}}}
  /portal/procurement-orders:
    get:
      tags: [Portal]
      security: [{portalAuth: []}]
      summary: 我的执行单（仅 assigned/claimed/purchased/shipped；视图白名单字段）
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/size'}
        - {name: status, in: query, schema: {type: string, enum: [assigned, claimed, purchased, shipped]}}
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProcurementPage'}}}}}
  /portal/procurement-orders/{poId}:
    get:
      tags: [Portal]
      security: [{portalAuth: []}]
      parameters: [{$ref: '#/components/parameters/poId'}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PortalProcurement'}}}}}
  /portal/procurement-orders/{poId}/claim:
    post:
      tags: [Portal]
      security: [{portalAuth: []}]
      parameters: [{$ref: '#/components/parameters/poId'}]
      responses: {'200': {description: OK}, '409': {$ref: '#/components/responses/Error'}}
  /portal/procurement-orders/{poId}/backfill:
    post:
      tags: [Portal]
      security: [{portalAuth: []}]
      summary: 门户回填（受限列：采购平台/单号/成本/物流）
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody: {$ref: '#/components/requestBodies/ProcurementBackfill'}
      responses: {'200': {description: OK}}
  /portal/procurement-orders/{poId}/exception:
    post:
      tags: [Portal]
      security: [{portalAuth: []}]
      parameters: [{$ref: '#/components/parameters/poId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string}}
      responses: {'200': {description: OK}}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 内部 JWT（audience=erp）}
    portalAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 门户 JWT（audience=portal）}

  parameters:
    page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    idempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 64}}
    teamId: {name: teamId, in: path, required: true, schema: {type: integer}}
    userId: {name: userId, in: path, required: true, schema: {type: integer}}
    roleId: {name: roleId, in: path, required: true, schema: {type: integer}}
    storeId: {name: storeId, in: path, required: true, schema: {type: integer}}
    productId: {name: productId, in: path, required: true, schema: {type: integer}}
    listingId: {name: listingId, in: path, required: true, schema: {type: integer}}
    orderId: {name: orderId, in: path, required: true, schema: {type: integer}}
    poId: {name: poId, in: path, required: true, schema: {type: integer}}
    returnId: {name: returnId, in: path, required: true, schema: {type: integer}}
    refundRequestId: {name: refundRequestId, in: path, required: true, schema: {type: integer}}

  responses:
    Error:
      description: 统一错误信封
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Team: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Team'}}}}
    TeamPage: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TeamPage'}}}}
    UserResp: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
    UserPage: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/UserPage'}}}}

  requestBodies:
    TeamWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string}
              status: {type: string, enum: [active, disabled]}
              settings: {type: object}
    UserWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              username: {type: string}
              password: {type: string, format: password}
              display_name: {type: string}
              status: {type: string, enum: [active, disabled, locked]}
    RoleWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string}
              description: {type: string}
    StoreWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              channel_id: {type: integer}
              code: {type: string}
              name: {type: string}
              status: {type: string, enum: [active, paused, suspended, closed]}
              operating_mode: {type: string, enum: [build, match, mixed]}
              dedup_exempt: {type: boolean}
              is_test: {type: boolean}
              legal_entity: {type: string}
              payment_label: {type: string}
              opened_at: {type: string, format: date}
              profile: {type: object}
              notes: {type: string}
    ProxyWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              kind: {type: string, enum: [socks5, http]}
              host: {type: string}
              port: {type: integer}
              username: {type: string}
              password: {type: string, format: password, description: 只写不读}
              vendor: {type: string}
              status: {type: string, enum: [active, expired, disabled]}
              expires_at: {type: string, format: date}
              monthly_cost: {type: number}
              note: {type: string}
    StoreIncidentWrite:
      content:
        application/json:
          schema:
            type: object
            required: [store_id, incident_kind, occurred_at]
            properties:
              store_id: {type: integer}
              incident_kind: {type: string, enum: [suspension, warning, listing_block, other]}
              occurred_at: {type: string, format: date-time}
              reason: {type: string}
    VariantGroupWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              source_parent_ref: {type: string}
              variation_theme: {type: string}
    ProductSourceWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              source_platform: {type: string, default: '1688'}
              source_url: {type: string, format: uri}
              source_price_cny: {type: number}
              freight_cny: {type: number}
              total_cost_cny: {type: number}
              risk_note: {type: string}
              status: {type: string, enum: [candidate, confirmed, invalid]}
    PricingStrategyWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              store_id: {type: [integer, 'null']}
              offer_mode: {type: string, enum: [build, match]}
              name: {type: string}
              algo_code: {type: string}
              params: {type: object, description: min_price 底线可选（D-Q62 补充；填了须 >0，低于底线不出价）}
              status: {type: string, enum: [active, disabled]}
    PurchaserWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string}
              purchaser_kind: {type: string, enum: [internal, external]}
              user_id: {type: [integer, 'null'], description: internal 必填}
              contact: {type: object}
              exchange_rate: {type: number}
              status: {type: string, enum: [active, disabled]}
              portal_username: {type: string, description: external 开门户账号}
              portal_password: {type: string, format: password}
    ProcurementBackfill:
      content:
        application/json:
          schema:
            type: object
            properties:
              purchase_platform: {type: string}
              purchase_order_ref: {type: string}
              purchase_cost: {type: number}
              purchase_currency: {type: string, default: CNY}
              freight_cost: {type: number}
              carrier: {type: string}
              tracking_no: {type: string}
              note: {type: string}


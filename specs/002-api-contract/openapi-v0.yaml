  # ───────────────────── ScrapeWorker（采集节点） ─────────────────────
  # **路径里的双版本号 `/api/v1/worker/v1/…` 是如实登记、不是笔误**：`worker_router` 自带
  # `prefix=/worker/v1`（`scrape/router.py:26`）又被挂在 `/api/v1` 下叠出来的。改路径是破坏性
  # 的（采集 worker 在跑），故保留现状并在此照实写明。
  # 认证走**第三个域**：`X-Node-Key` + `X-Node-Token` 双头部（非 JWT、无权限点）。
  # `register` 用一次性 enroll_token 换取长期凭证，因此它本身不带 node 认证。
  /worker/v1/register:
    post:
      tags: [ScrapeWorker]
      security: []
      summary: 节点注册（以 enroll_token 换取长期凭证）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_key, kind, enroll_token]
              properties:
                node_key: {type: string, minLength: 3, maxLength: 64}
                kind: {type: string, enum: [scraper_amazon, scraper_walmart]}
                enroll_token: {type: string}
                version: {type: [string, 'null']}
                capacity: {type: integer, minimum: 1, maximum: 64, default: 1}
      responses:
        '201': {description: Created, content: {application/json: {schema: {type: object}}}}
  /worker/v1/sync:
    post:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 节点心跳与状态上报
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: [string, 'null']}
                metrics: {type: object}
                window_state: {type: object}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object}}}}
  /worker/v1/tasks/pull:
    get:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 认领采集任务
      parameters:
        - {name: count, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [tasks], properties: {tasks: {type: array, items: {type: object}}}}
  /worker/v1/tasks/release:
    post:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 释放已认领任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  items: {type: object, properties: {task_id: {type: integer}, attempt: {type: integer}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {type: object, required: [released], properties: {released: {type: integer}}}
  /worker/v1/tasks/result:
    post:
      tags: [ScrapeWorker]
      security: [{nodeKeyAuth: [], nodeTokenAuth: []}]
      summary: 回传采集结果
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, attempt]
              properties:
                task_id: {type: integer}
                attempt: {type: integer}
                success: {type: boolean, default: true}
                payload: {type: [object, 'null']}
                payload_ref: {type: [string, 'null']}
                fetched_at: {type: [string, 'null'], format: date-time}
                error_type: {type: [string, 'null']}
                error_detail: {type: [string, 'null']}
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: object}}}}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 内部 JWT（audience=erp）}
    portalAuth: {type: http, scheme: bearer, bearerFormat: JWT, description: 门户 JWT（audience=portal）}
    nodeKeyAuth: {type: apiKey, in: header, name: X-Node-Key, description: 采集节点标识（与 nodeTokenAuth 同时提供）}
    nodeTokenAuth: {type: apiKey, in: header, name: X-Node-Token, description: 采集节点令牌（`scrape/router.py::_node_auth` 双头部校验）}

  parameters:
    page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    idempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 64}}
    teamId: {name: teamId, in: path, required: true, schema: {type: integer}}
    userId: {name: userId, in: path, required: true, schema: {type: integer}}
    roleId: {name: roleId, in: path, required: true, schema: {type: integer}}
    storeId: {name: storeId, in: path, required: true, schema: {type: integer}}
    productId: {name: productId, in: path, required: true, schema: {type: integer}}
    listingId: {name: listingId, in: path, required: true, schema: {type: integer}}
    orderId: {name: orderId, in: path, required: true, schema: {type: integer}}
    poId: {name: poId, in: path, required: true, schema: {type: integer}}
    returnId: {name: returnId, in: path, required: true, schema: {type: integer}}
    refundRequestId: {name: refundRequestId, in: path, required: true, schema: {type: integer}}
    incidentId: {name: incidentId, in: path, required: true, schema: {type: integer}}
    assignmentId: {name: assignmentId, in: path, required: true, schema: {type: integer}}
    flowCode: {name: flowCode, in: path, required: true, schema: {type: string}}

  responses:
    Error:
      description: 统一错误信封
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Team: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Team'}}}}
    TeamPage: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/TeamPage'}}}}
    UserResp: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
    UserPage: {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/UserPage'}}}}

  requestBodies:
    TeamWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string}
              status: {type: string, enum: [active, disabled]}
              settings: {type: object}
    UserWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              username: {type: string}
              password: {type: string, format: password}
              display_name: {type: string}
              status: {type: string, enum: [active, disabled, locked]}
    RoleWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string}
              description: {type: string}
    StoreWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              channel_id: {type: integer}
              code: {type: string}
              name: {type: string}
              status: {type: string, enum: [active, paused, suspended, closed]}
              operating_mode: {type: string, enum: [build, match, mixed]}
              dedup_exempt: {type: boolean}
              is_test: {type: boolean}
              legal_entity: {type: string}
              payment_label: {type: string}
              opened_at: {type: string, format: date}
              profile: {type: object}
              notes: {type: string}
    ProxyWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              kind: {type: string, enum: [socks5, http]}
              host: {type: string}
              port: {type: integer}
              username: {type: string}
              password: {type: string, format: password, description: 只写不读}
              vendor: {type: string}
              status: {type: string, enum: [active, expired, disabled]}
              expires_at: {type: string, format: date}
              monthly_cost: {type: number}
              note: {type: string}
    StoreIncidentWrite:
      content:
        application/json:
          schema:
            type: object
            required: [store_id, incident_kind, occurred_at]
            properties:
              store_id: {type: integer}
              incident_kind: {type: string, enum: [suspension, warning, listing_block, other]}
              occurred_at: {type: string, format: date-time}
              reason: {type: string}
    VariantGroupWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              source_parent_ref: {type: string}
              variation_theme: {type: string}
    ProductSourceWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              source_platform: {type: string, default: '1688'}
              source_url: {type: string, format: uri}
              source_price_cny: {type: number}
              freight_cny: {type: number}
              total_cost_cny: {type: number}
              risk_note: {type: string}
              status: {type: string, enum: [candidate, confirmed, invalid]}
    PricingStrategyWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              store_id: {type: [integer, 'null']}
              offer_mode: {type: string, enum: [build, match]}
              name: {type: string}
              algo_code: {type: string}
              params: {type: object, description: min_price 底线可选（D-Q62 补充；填了须 >0，低于底线不出价）}
              status: {type: string, enum: [active, disabled]}
    PurchaserWrite:
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string}
              purchaser_kind: {type: string, enum: [internal, external]}
              user_id: {type: [integer, 'null'], description: internal 必填}
              contact: {type: object}
              exchange_rate: {type: number}
              status: {type: string, enum: [active, disabled]}
              portal_username: {type: string, description: external 开门户账号}
              portal_password: {type: string, format: password}
    ProcurementBackfill:
      content:
        application/json:
          schema:
            type: object
            properties:
              purchase_platform: {type: string}
              purchase_order_ref: {type: string}
              purchase_cost: {type: number}
              purchase_currency: {type: string, default: CNY}
              freight_cost: {type: number}
              carrier: {type: string}
              tracking_no: {type: string}
              note: {type: string}

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            detail: {type: object}
            request_id: {type: string}
    PageMeta:
      type: object
      properties:
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    AutomationPolicy:
      type: object
      description: >
        档位面板一行 = flow 注册表 ∪ 本团队 automation_policy 行的合并结果。
        无行的 flow 也会出现（state=unset），面板据此可对任意 flow 直接 PUT。
        三态（unset / disabled / configured）在 API 层显性区分，**不压成单个 mode 字段**。
      required: [flow_code, legal_modes, evaluation, state, mode, enabled, effective_mode, illegal_for_flow, gate, wired, config, updated_at, updated_by]
      properties:
        flow_code: {type: string, description: 001 §09 v2.1 注册码（10 条）}
        legal_modes: {type: array, items: {type: string, enum: [manual, semi, auto]}, description: 该 flow 的合法档位，按 manual→semi→auto 排序；闸类（order_block/compliance_block）只有两档。面板据此渲染档位选择器，前端不得硬编码档位集}
        evaluation: {type: string, enum: [realtime, snapshot], description: realtime=下次决策即生效；snapshot=创建时固化，切档不影响在途请求}
        state: {type: string, enum: [unset, disabled, configured], description: unset=本团队无行（等同人工，从未配置）；disabled=有行但 enabled=false（等同人工，是被人关掉的）；configured=有行且启用}
        mode: {type: [string, 'null'], description: 库中原值；state=unset 时 null。理论上受 ck_automation_mode 约束在三档内，绕过约束的坏值原样透出以便运维发现}
        enabled: {type: [boolean, 'null'], description: state=unset 时 null}
        effective_mode: {type: string, enum: [manual, semi, auto], description: 与内核 resolve_mode 逐字等价（同一纯函数），含「闸类存非法档位原样生效」}
        illegal_for_flow: {type: boolean, description: 库中档位不在该 flow 的 legal_modes。DB 的 ck_automation_mode 不区分 flow，只能在服务层挡}
        gate: {type: boolean, description: 闸类（legal_modes 无 semi）——manual 是放松不是收紧。由服务端从 FlowSpec 派生，前端不得自行硬编码闸类清单}
        wired: {type: boolean, description: 已接消费点（代码事实，见 core/automation.py WIRED_FLOWS）。false=改档只落库不改变任何行为，前端不得对其渲染「拦截生效/不生效」}
        config: {type: [object, 'null'], additionalProperties: true, description: 只读透传。本增量 PUT 不接受该字段——全仓零消费点，写入只会造成「护栏已配」的错觉}
        updated_at: {type: [string, 'null'], format: date-time}
        updated_by: {type: [integer, 'null'], description: app_user.id（本增量不联查显示名，保持最小面）}
    TokenPair:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer}
    DictItem:
      type: object
      properties:
        code: {type: string}
        label: {type: string}
        sort: {type: integer}
        meta: {type: object}
    Team:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
    TeamPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Team'}}}}
    User:
      type: object
      properties:
        id: {type: integer}
        team_id: {type: [integer, 'null']}
        username: {type: string}
        display_name: {type: string}
        is_super: {type: boolean}
        status: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        last_login_at: {type: [string, 'null'], format: date-time}
    UserPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/User'}}}}
    Role:
      type: object
      properties:
        id: {type: integer}
        team_id: {type: [integer, 'null']}
        name: {type: string}
        description: {type: [string, 'null']}
        permission_codes: {type: array, items: {type: string}}
    Permission:
      type: object
      properties:
        code: {type: string}
        module: {type: string}
        name: {type: string}
    AuditLog:
      type: object
      properties:
        id: {type: integer}
        occurred_at: {type: string, format: date-time}
        actor_type: {type: string, enum: [user, portal, system]}
        actor_id: {type: [integer, 'null']}
        action: {type: string}
        object_type: {type: string}
        object_id: {type: string}
        before: {type: [object, 'null']}
        after: {type: [object, 'null']}
        ip: {type: [string, 'null']}
    AuditLogPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditLog'}}}}
    AuditResult:
      type: object
      description: >
        一次审核的落库结果（`audit/service.py::audit_one` 的返回）。**单品送审 201 与批量
        audited[] 同源于本 schema**——批量只是循环调同一段内核，结果形状不该有第二套。
        `verdict=needs_review` 是**产生了 run** 的一种结果（判不下来，转人工复核），不是失败。
      required: [run_id, verdict, reject_level, llm_cost_usd, product_status]
      properties:
        run_id: {type: integer, description: app.audit_run.id}
        verdict: {type: string, enum: [pass, reject, needs_review]}
        reject_level: {type: [string, 'null'], enum: [l0, l1, l3, null], description: 首个否决层；verdict≠reject 时 null。**无 l2**——L2 是软证据只写 hit 不改 verdict；l4 未开放}
        llm_cost_usd: {type: number, description: 本次运行的 LLM 花费；缓存命中不计费故为 0}
        product_status: {type: [string, 'null'], description: 审核后的 product.status（audit_passed/audit_rejected/needs_review）；并发重审时本 run 让位于更新的 run，只留档不改状态，此时为 null}
    AuditBatchItem:
      description: audited[] 的一条 = 单品送审的结果 + product_id（只多回带 id，其余逐字同源）。
      allOf:
        - {$ref: '#/components/schemas/AuditResult'}
        - {type: object, required: [product_id], properties: {product_id: {type: integer}}}
    AuditBatchSkip:
      type: object
      description: >
        未产生可用结果的一条。`skipped` 与 `failed` 同形（都是 product_id + 错误码 + 人话），
        差别在代价而不在形状，故共用本 schema，取值范围见 AuditBatchResult 各字段的说明。
      required: [product_id, code, message]
      properties:
        product_id: {type: integer}
        code: {type: string, examples: [AUDIT_PRODUCT_NOT_FOUND, AUDIT_STATE_INVALID, AUDIT_ITEM_FAILED]}
        message: {type: string}
    AuditBatchResult:
      type: object
      description: >
        批量送审的逐条结果。**结构不变量**：`len(audited)+len(skipped)+len(failed)+len(remaining)`
        恒等于去重后的入参条数，四桶的 product_id 并集 == 去重入参、两两不交。
        前端据此可直接断言「一个都没漏」，不必自己拿入参回比。
      required: [audited, skipped, failed, remaining, verdict_counts, total_llm_cost_usd]
      properties:
        audited: {type: array, items: {$ref: '#/components/schemas/AuditBatchItem'}, description: 产生了 audit_run 的（含 verdict=needs_review）}
        skipped: {type: array, items: {$ref: '#/components/schemas/AuditBatchSkip'}, description: '开审之前即被判掉、未建 run，**零金钱代价**。code **只可能是这两个**（服务端按白名单归桶，白名单外的业务异常一律进 failed——「可能已扣费」的方向更保守，响应绝不能对成本说谎）：AUDIT_PRODUCT_NOT_FOUND=不存在**或**越权（他团队的 id 故意不分码，否则本端点可被拿来探测他团队 product_id 是否存在）；AUDIT_STATE_INVALID=当前状态不可发起审核'}
        failed: {type: array, items: {$ref: '#/components/schemas/AuditBatchSkip'}, description: '已开审但中途异常中断（AUDIT_ITEM_FAILED）。可能已建 run、已发生花费，代价与 skipped 不同故分桶；失败一条不中断整批。**该产品会停在 status=auditing**（tx1 已置、tx2 未及回写），运维处置见 `.agent/evidence/R2-09/runbook-increment3a.md`。message 只含错误类名与固定人话，原始异常文本只进服务端日志（它常含 SQL 片段/连接参数，而本字段会原样显示给运营）'}
        remaining: {type: array, items: {type: integer}, description: '**裸 id 数组**（保序）：因墙钟预算耗尽或 provider 熔断而**根本没轮到开审**的 product_id。不是失败、无任何代价，前端把它原样当作下一批的 product_ids 续跑即可。刻意不逐条生成 skipped 条目——剩余可能很多，逐条 message 只是把同一句话复制 N 遍'}
        verdict_counts:
          type: object
          description: audited[] 按 verdict 的计数；三键恒在（无该结果时为 0），三值之和 == len(audited)。
          required: [pass, reject, needs_review]
          properties:
            pass: {type: integer}
            reject: {type: integer}
            needs_review: {type: integer}
        total_llm_cost_usd: {type: number, description: '本批已发生的 LLM 花费合计 = audited[] 各条 llm_cost_usd 之和'}
        idempotent_replay: {type: boolean, description: 幂等重放才出现（`core/idempotency.py` 给存储响应加的标记），首次执行**无此键**——故不列入 required。true=本次一条都没重跑、一分钱没花，返回的是上次的结果；前端不该把它当作「又审了一遍」}
    ScrapeJob:
      type: object
      properties:
        id: {type: integer}
        source: {type: string}
        job_kind: {type: string}
        status: {type: string, enum: [pending, running, done, partial, failed, cancelled]}
        priority: {type: integer}
        total_tasks: {type: integer}
        done_tasks: {type: integer}
        failed_tasks: {type: integer}
        requested_by: {type: integer, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    ScrapeJobPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ScrapeJob'}}}}
    WorkerNode:
      type: object
      properties:
        id: {type: integer}
        node_key: {type: string}
        kind: {type: string, enum: [scraper_amazon, scraper_walmart]}
        version: {type: string, nullable: true}
        status: {type: string, enum: [online, offline, draining]}
        capacity: {type: integer}
        last_heartbeat_at: {type: string, format: date-time, nullable: true}
        stats: {type: object}
    Store:
      type: object
      properties:
        id: {type: integer}
        channel_id: {type: integer}
        code: {type: string}
        name: {type: string}
        status: {type: string}
        operating_mode: {type: string}
        dedup_exempt: {type: boolean}
        is_test: {type: boolean}
        proxy_id: {type: [integer, 'null']}
        legal_entity: {type: [string, 'null']}
        payment_label: {type: [string, 'null']}
        opened_at: {type: [string, 'null'], format: date}
        suspended_at: {type: [string, 'null'], format: date-time}
        notes: {type: [string, 'null']}
    StorePage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Store'}}}}
    Proxy:
      type: object
      properties:
        id: {type: integer}
        kind: {type: string}
        host: {type: string}
        port: {type: integer}
        username: {type: [string, 'null']}
        vendor: {type: [string, 'null']}
        status: {type: string}
        expires_at: {type: [string, 'null'], format: date}
        bound_store_id: {type: [integer, 'null'], description: 反查（独占绑定）}
    ProxyPage:
      allOf:
        - {$ref: '#/components/schemas/PageMeta'}
        - {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Proxy'}}}}
    QuotaConfig:

    # 建号与改号的入参**故意分成两个 requestBody**：唯一的差别是 `status` 的枚举
    # （建号只收人工四值，见下），而那正是必须在契约里看得见的差别——共用一个 schema
    # 会让「建号能不能直接建 pending_claim」只存在于服务层代码里，前端与部署机无从对表。
    BuyerAccountCreate:
      content:
        application/json:
          schema:
            type: object
            description: '建号（可选预建捷径）。label/site/external_customer_id 必填（服务层校验，缺则 422 BUYER_ACCOUNT_FIELDS_REQUIRED）。`status` 只收人工四值——两个系统态由 422 BUYER_ACCOUNT_STATUS_NOT_CREATABLE 拒绝。'
            properties:
              label: {type: string, maxLength: 100, description: 运营可读名，语义=对应哪个指纹浏览器（07:258）}
              site: {type: string, enum: [amazon_com, amazon_ca, amazon_co_jp]}
              external_customer_id: {type: string, maxLength: 64, description: 插件侧 customerId。**首见自动登记是主路径**；本字段只在手工预建（可选捷径）时由运营填}
              # 词表 = 0043 `ck_buyer_account_status` 全集 **减去两个系统态**：
              # `pending_claim` 由插件首见自动登记独家生产（也是洪水闸精确性的前提——
              # 那把 advisory 锁只锁登记路径，多一个生产者 cap 就退化成近似值）；
              # `rejected` 只能从待认领行驳回而来，直接建即死行（终态 + 无 DELETE 授权）。
              status: {type: string, enum: [active, paused, blocked, retired], default: active, description: '建号可选的四个运营态；不传 = active。**系统态 pending_claim / rejected 一律 422**'}
              daily_cap: {type: [integer, 'null'], minimum: 1, description: 单日采购上限；null=不限}
              note: {type: string, maxLength: 1000}
    BuyerAccountWrite:
      content:
        application/json:
          schema:
            type: object
            description: '`PATCH` 按传入字段增量更新，**认领已有待认领行也走 PATCH**（补 label+site 并置 status=active）。建号入参见 `BuyerAccountCreate`（status 词表更窄）。'
            properties:
              label: {type: string, maxLength: 100, description: 运营可读名，语义=对应哪个指纹浏览器（07:258）}
              site: {type: string, enum: [amazon_com, amazon_ca, amazon_co_jp]}
              external_customer_id: {type: string, maxLength: 64, description: 插件侧 customerId。**首见自动登记是主路径**；本字段只在手工预建（可选捷径）时由运营填}
              status: {type: string, enum: [pending_claim, active, paused, blocked, retired, rejected], description: '非 active 一律不派新任务（含 pending_claim / rejected）；**但回填/异常/物流三条写路径不受影响**（钱可能已经花出去了）。合法转移见 PATCH 端点说明——任何态都不许改回 pending_claim'}
              daily_cap: {type: [integer, 'null'], minimum: 1, description: 单日采购上限；null=不限。**显式传 null 即改成不限**，不传=不动}
              note: {type: string, maxLength: 1000}

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}

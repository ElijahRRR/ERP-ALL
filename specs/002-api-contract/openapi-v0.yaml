    PageMeta:
      type: object
      properties:
        total: {type: integer}
        page: {type: integer}
        size: {type: integer}
    AutomationPolicy:
      type: object
      description: >
        档位面板一行 = flow 注册表 ∪ 本团队 automation_policy 行的合并结果。
        无行的 flow 也会出现（state=unset），面板据此可对任意 flow 直接 PUT。
        三态（unset / disabled / configured）在 API 层显性区分，**不压成单个 mode 字段**。
      required: [flow_code, legal_modes, evaluation, state, mode, enabled, effective_mode, illegal_for_flow, gate, wired, config, updated_at, updated_by]
      properties:
        flow_code: {type: string, description: 001 §09 v2.1 注册码（10 条）}
        legal_modes: {type: array, items: {type: string, enum: [manual, semi, auto]}, description: 该 flow 的合法档位，按 manual→semi→auto 排序；闸类（order_block/compliance_block）只有两档。面板据此渲染档位选择器，前端不得硬编码档位集}
        evaluation: {type: string, enum: [realtime, snapshot], description: realtime=下次决策即生效；snapshot=创建时固化，切档不影响在途请求}
        state: {type: string, enum: [unset, disabled, configured], description: unset=本团队无行（等同人工，从未配置）；disabled=有行但 enabled=false（等同人工，是被人关掉的）；configured=有行且启用}
        mode: {type: [string, 'null'], description: 库中原值；state=unset 时 null。理论上受 ck_automation_mode 约束在三档内，绕过约束的坏值原样透出以便运维发现}
        enabled: {type: [boolean, 'null'], description: state=unset 时 null}
        effective_mode: {type: string, enum: [manual, semi, auto], description: 与内核 resolve_mode 逐字等价（同一纯函数），含「闸类存非法档位原样生效」}
        illegal_for_flow: {type: boolean, description: 库中档位不在该 flow 的 legal_modes。DB 的 ck_automation_mode 不区分 flow，只能在服务层挡}
        gate: {type: boolean, description: 闸类（legal_modes 无 semi）——manual 是放松不是收紧。由服务端从 FlowSpec 派生，前端不得自行硬编码闸类清单}
        wired: {type: boolean, description: 已接消费点（代码事实，见 core/automation.py WIRED_FLOWS）。false=改档只落库不改变任何行为，前端不得对其渲染「拦截生效/不生效」}
        config: {type: [object, 'null'], additionalProperties: true, description: 只读透传。本增量 PUT 不接受该字段——全仓零消费点，写入只会造成「护栏已配」的错觉}
        updated_at: {type: [string, 'null'], format: date-time}
        updated_by: {type: [integer, 'null'], description: app_user.id（本增量不联查显示名，保持最小面）}
    TokenPair:
      type: object
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer}
    DictItem:
      type: object

      x-permission: catalog.product_write
      parameters: [{name: groupId, in: path, required: true, schema: {type: integer}}]
      responses:
        '200': {description: 'OK（{group_id, released_store_id, detail=组详情}）'}
        '409': {description: 未锚定（VARIANT_ANCHOR_NOT_SET）或锚定店仍有在途/在架成员（VARIANT_ANCHOR_IN_USE，fail-closed）}

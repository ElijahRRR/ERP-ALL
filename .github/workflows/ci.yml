name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 只读门禁③（铁律 4 机器化）：改了渠道写路径就必须同 diff 带 .agent/evidence/ 变更。
  # 起因见 scripts/ci_evidence_gate.py 头注（2026-07-26 Owner 审计：R2-12 增量 1/3/4b 在
  # 「待分支验证」态直接合并，4b 属渠道写路径却全单零 dry-run 快照落仓）。
  # 首轮以 advisory 上车（只告警不拦），观察一段时间确认无误伤后删掉 ADVISORY 即变硬闸。
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # merge-base 需要完整历史
      - name: 渠道写路径 evidence 门禁
        env:
          ADVISORY: "1"
        run: python3 scripts/ci_evidence_gate.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: backend}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: erp_all
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_all"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ERP_MIGRATOR_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erp_all
      ERP_DATABASE_URL: postgresql+psycopg://erp_app:erp_app@localhost:5432/erp_all
      ERP_REDIS_URL: redis://localhost:6379/0
      # 库不可达时 tests/db/conftest.py 默认静默跳过（本地开发方便）；CI 必须硬失败，
      # 否则 postgres 服务起不来 / DSN 写错时近 400 个 DB 集成测试无声消失而 CI 照样绿。
      ERP_REQUIRE_DB: "1"
      # RS-02a：Settings 自检会拒绝已知默认密钥。CI 的 postgres/redis 是一次性服务容器、
      # 用的正是那些弱口令 → 在此**显式声明放行**。这一行本身就是那份声明（部署侧的
      # compose 里没有它，故部署机拿不到这个豁免）。pytest 侧另有 tests/conftest.py，
      # 这里主要覆盖直接跑 alembic 的那一步。
      ERP_ALLOW_INSECURE_DEFAULTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - name: 安装依赖
        run: uv sync --frozen
      - name: Lint（ruff）
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 类型检查（mypy strict）
        run: uv run mypy
      # 演练必须在 pytest **之前**：它的名字说的就是「空库」，而 pytest 与它共用
      # erp_all，跑完会留下测试残余。0045 起降级对「新词表已写入的行」按 0047 口径
      # **有意硬失败**（backfill_actor_kind='plugin' 等，须人工处置后才许降）——
      # 排在 pytest 之后等于必然撞上这条设计，红的是步序不是迁移（a9d9396 实证：
      # 套件留下一行 (plugin, purchased)，downgrade base 即 CheckViolation）。
      # 放到前面后本步只验它该验的：空库上 DDL 升降升对称。pytest 的 migrated_db
      # fixture 自己跑 upgrade head，库已在 head 时是幂等 no-op，顺序对它无影响。
      - name: migration 空库演练（升→降→升）
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: 单元测试
        run: uv run pytest

  workers:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: workers}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - name: 安装依赖
        run: uv sync --frozen
      - name: Lint（ruff）
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 类型检查（mypy）
        run: uv run mypy src tests
      - name: 单元测试
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # 版本读 packageManager 字段，与 corepack 同源（默认只找仓库根，须指路）
        with: {package_json_file: frontend/package.json}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml}
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 契约 codegen 新鲜度（schema.d.ts 必须与 openapi 同 PR 更新）
        # 008 §5.1 此前纯靠人审——改了 002 契约忘跑 gen:api，类型与契约就静默漂移
        # （审查 2026-07-28 R10）。openapi-typescript 版本锁在 lockfile，产物确定。
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Lint（eslint）
        run: pnpm lint
      - name: 构建（tsc + vite build）
        run: pnpm build
      # 仓内**第一条前端渲染判据**（FE-TEST-01 此前记为「零前端测试」）。起因见脚本头注：
      # 未配置行被 antd Segmented 渲染成「已选中人工」——tsc/eslint/后端测试全看不见，
      # 只在渲染后存在，是部署机第三闸的人工目验抓到的。人工目验不可复跑，故补此闸。
      # playwright 早在首个前端 commit 就进了 devDependencies，一直没有任何东西用它。
      - name: 面板渲染判据（headless chromium）
        run: |
          pnpm exec playwright install --with-deps chromium
          # **必须显式 --host 127.0.0.1**：vite preview 默认 host 是 `localhost`，而
          # Node 17+ 的 DNS 解析顺序是 verbatim——runner 上 `localhost` 先解析到 ::1 时
          # 服务只监听 IPv6，用 127.0.0.1 去打恒为 000（首版 CI 实测 60s 轮询全 000，
          # 而沙箱 `localhost` 直接是 127.0.0.1 所以本地复现不出来）。两侧钉死 IPv4。
          pnpm preview --port 4173 --strictPort --host 127.0.0.1 &
          # 就绪轮询而非固定 sleep：起完就打会拿到空响应（部署机 healthz 踩过同款，
          # 判据是最终状态码，不是单次 curl 的退出码）。
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4173/automation || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "preview 未就绪（最终 $code）"; ss -lntp || true; exit 1; }
          node e2e/automation-panel.mjs
          # 批量送审（R2-09 增量3a）。**必须接在这里**：该脚本守的三条语义（幂等键
          # 跨两次点击的稳定性、nonce 生命周期、504 无信封归 NO_RESULT 兜底）tsc /
          # eslint / 后端测试全看不见，改坏了直接就是同一批产品付两遍 LLM 的钱。
          # 不接 CI 的测试文件比没有更糟——它会让后来的审查者误以为这块有覆盖。
          node e2e/products-batch.mjs
          # 买家账号认领 / 驳回流（R2-13 身份模型更正）。同样接在这里，理由同上一条：
          # 它守的三条语义（认领表单站点**无默认值**、待认领行走认领而非编辑、驳回过
          # 二次确认且文案写明终态）全部只在渲染后存在，改坏了后端与 tsc 一律全绿——
          # 而站点填错的后果是这个买家号收到它根本买不了的单。
          node e2e/buyer-accounts-claim.mjs

  # 采购插件（R2-13 13e；vendored 进本仓 amz-plugin/，见该目录 README/联调单）。
  # 花钱链路的机器门禁：纯静态 + 纯逻辑单测，不碰 secrets/DB。原独立 fork 仓的
  # plugin-ci 迁到这里，插件不再单开 PR/单跑闸——归本仓一个 PR、一套闸序。
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: amz-plugin}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: JS 语法检查（node --check）
        run: for f in js/*.js; do node --check "$f"; done
      - name: manifest.json 合法
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: prettier 格式（钉版 3.6.2）
        run: npx --yes prettier@3.6.2 --check "js/**/*.js" manifest.json
      - name: 残留清扫（cookies 链与零调用权限必须删净）
        run: |
          if grep -rinE "cookie|chrome\.(storage|tabs|scripting|cookies)" js/ manifest.json popup.html; then
            echo "::error::命中 cookies 链 / storage|tabs|scripting|cookies 残留——13e ③④ 要求删净"
            exit 1
          fi
          echo "残留清扫零命中"
      - name: 凭证不入库守卫（13e ③闸安全事件回修）
        run: |
          if git ls-files --error-unmatch js/config.local.js 2>/dev/null; then
            echo "::error::amz-plugin/js/config.local.js 被提交进仓库——凭证文件必须 gitignore，永不入库"
            exit 1
          fi
          if ! grep -q "YOUR_PLUGIN_SHARED_TOKEN" js/popup.js; then
            echo "::error::popup.js 丢失 token 占位符——疑似把真实 token 写死进 tracked 文件"
            exit 1
          fi
          echo "凭证守卫通过：config.local.js 未入库、popup.js 保留占位符"
      - name: 纯逻辑单测（三档兜底 / fail-closed / token 注入 / 州匹配）
        run: node --test tests/*.test.mjs

# 本地全栈：make up（＝ docker compose -f infra/docker-compose.yml up）
#
# ⚠️ 起之前必须有 infra/.env（从 infra/.env.example 复制后填强随机值）。所有口令一律
# `${VAR:?...}` 取——**没有默认回退**：变量缺失时 compose 直接报错拒起，而不是悄悄用
# 一个人人皆知的口令把库开在网上（RS-02a / D-Q68，2026-07-27）。
name: erp-all

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_all
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/.env 缺 POSTGRES_PASSWORD}
      # 三业务角色的口令：只在**空卷首次 initdb** 时被 pg-init/02-roles.sh 读取。
      # 卷已存在时改这里不会真的改密——见 infra/.env.example 的「换库口令」一节。
      ERP_APP_DB_PASSWORD: ${ERP_APP_DB_PASSWORD:?infra/.env 缺 ERP_APP_DB_PASSWORD}
      ERP_MIGRATOR_DB_PASSWORD: ${ERP_MIGRATOR_DB_PASSWORD:?infra/.env 缺 ERP_MIGRATOR_DB_PASSWORD}
      PORTAL_APP_DB_PASSWORD: ${PORTAL_APP_DB_PASSWORD:?infra/.env 缺 PORTAL_APP_DB_PASSWORD}
    # 只绑 loopback：容器间走 compose 内部网络（服务名 db），本不需要暴露给内网。
    # 保留宿主机映射是为了部署机本机 psql 取证；内网其他设备连不上即本单验收标准。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_all"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # $$ 转义 → 交给容器内的 sh 展开，口令不出现在 compose 的渲染结果里。
    # 〔2026-07-27 审查 AI 的 S4〕**不要以为它也躲开了进程表**：sh 展开后真正跑的是
    # `redis-server --requirepass <明文>`，容器进程就是宿主机进程，`ps aux` 与
    # `docker inspect` 都看得到。要那个性质得改挂 redis.conf，本单不做。
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?infra/.env 缺 REDIS_PASSWORD}
      # redis-cli 自动读该变量 → healthcheck 不必把口令写进命令行
      REDISCLI_AUTH: ${REDIS_PASSWORD:?infra/.env 缺 REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # 加了 requirepass 之后未认证的 PING 返回 NOAUTH 而**退出码仍为 0**，
      # 原来的 ["CMD","redis-cli","ping"] 会把「认证没配对」判成健康 → 必须验回显。
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      # 缺省即 prod（2026-07-27 审查 AI 的 S1）：此前压根没注入 ERP_ENV，部署机上
      # Settings.env 恒为默认的 "dev"，于是「prod 下不许放行弱密钥」那层保护从未生效。
      # 本机确实要跑开发档时才在 infra/.env 里显式写 ERP_ENV=dev。
      ERP_ENV: ${ERP_ENV:-prod}
      ERP_DATABASE_URL: postgresql+psycopg://erp_app:${ERP_APP_DB_PASSWORD:?infra/.env 缺 ERP_APP_DB_PASSWORD}@db:5432/erp_all
      ERP_MIGRATOR_DATABASE_URL: postgresql+psycopg://erp_migrator:${ERP_MIGRATOR_DB_PASSWORD:?infra/.env 缺 ERP_MIGRATOR_DB_PASSWORD}@db:5432/erp_all
      ERP_REDIS_URL: redis://:${REDIS_PASSWORD:?infra/.env 缺 REDIS_PASSWORD}@redis:6379/0
      # 应用密钥：默认值是 dev-only-change-me，留着即被 Settings 的启动自检拒起
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:?infra/.env 缺 ERP_JWT_SECRET}
      ERP_CREDENTIAL_KEY: ${ERP_CREDENTIAL_KEY:?infra/.env 缺 ERP_CREDENTIAL_KEY}
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ../backend
    restart: unless-stopped
    command: ["uvicorn", "erp.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend_env
    # 8000 保持内网可达（D-Q68 明确划在 RS-02a 范围外）：前端与团队成员要用，且它背后
    # 有登录/权限/RLS/审计四层。db、redis 那两个口不同——直连即完全绕过这四层。
    # 明文 HTTP、无反代 → RS-02b（HTTPS 反代）承接。
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # beat：schedule 表驱动的周期任务（R2-04）——feed 自动轮询/采集回收/对账/清扫/告警。
  # 回滚 = 停本容器（无状态残留，人工端点全部保留）。
  beat:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "erp.beat"]
    environment: *backend_env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # 通用队列 worker 占位：代码中尚无任何队列生产者（审核走请求内三段式、采集走
  # PG 拉取协议）——随首个队列生产者启用，空转消费者不上线（R2-04 范围注记）。
  # worker:
  #   build: ../backend
  #   command: ["python", "-m", "erp.worker"]
  #   environment: *backend_env

  # 采集 worker（R2-01）：独立镜像，出站拨入 api 领任务真抓 Amazon。
  # profile 门控——默认 up 不启动；需 TPS 代理 + 注册令牌就位后显式起：
  #   ERP_WORKER_ENROLL_TOKEN=<令牌> PROXY_URL=http://user:pwd@tps:port \
  #     docker compose -f infra/docker-compose.yml --profile scraper up -d --build scraper
  scraper:
    build: ../workers
    restart: unless-stopped
    command:
      - "--server"
      - "http://api:8000"
      - "--enroll-token"
      - "${ERP_WORKER_ENROLL_TOKEN:-}"
      - "--proxy"
      - "${PROXY_URL:-}"
      - "--node-key"
      - "${ERP_WORKER_NODE_KEY:-erp-scraper-1}"
    volumes:
      - scraper_state:/root/.erp_worker
    depends_on:
      api: {condition: service_started}
    profiles: ["scraper"]

  # 生产前端（INFRA-0716）：构建产物 + nginx 静态伺服，默认随 up 启动。
  # 部署 = up -d --build frontend（重建镜像即换版本；index.html 不缓存 + hashed
  # 资产不可变——根治 dev vite 的 stale 模块事故：HF-0716①/FE-0716 两起同源）。
  # 端口保持 5173，Owner 访问地址不变。
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api: {condition: service_started}

  # 开发用 vite（HMR；仅本地开发显式启用，与生产 frontend 端口互斥不可同起）：
  #   docker compose -f infra/docker-compose.yml --profile dev up -d frontend-dev
  frontend-dev:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      # 容器内 API 走 docker 网络名（vite.config.ts 读取；宿主机跑 vite 时无需此变量）
      VITE_API_PROXY_TARGET: http://api:8000
    # corepack 按 package.json 的 packageManager 钉死 pnpm 版本（曾因拉到 pnpm 11 导致 install 失败）
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    profiles: ["dev"]

volumes:
  pgdata:
  scraper_state:

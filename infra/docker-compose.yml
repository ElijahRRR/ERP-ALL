# 本地全栈：docker compose -f infra/docker-compose.yml up
# （仓库根 Makefile 提供快捷方式 make up）
name: erp-all

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_all
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_all"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      ERP_DATABASE_URL: postgresql+psycopg://erp_app:erp_app@db:5432/erp_all
      ERP_MIGRATOR_DATABASE_URL: postgresql+psycopg://erp_migrator:erp_migrator@db:5432/erp_all
      ERP_REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ../backend
    restart: unless-stopped
    command: ["uvicorn", "erp.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend_env
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # beat：schedule 表驱动的周期任务（R2-04）——feed 自动轮询/采集回收/对账/清扫/告警。
  # 回滚 = 停本容器（无状态残留，人工端点全部保留）。
  beat:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "erp.beat"]
    environment: *backend_env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # 通用队列 worker 占位：代码中尚无任何队列生产者（审核走请求内三段式、采集走
  # PG 拉取协议）——随首个队列生产者启用，空转消费者不上线（R2-04 范围注记）。
  # worker:
  #   build: ../backend
  #   command: ["python", "-m", "erp.worker"]
  #   environment: *backend_env

  # 采集 worker（R2-01）：独立镜像，出站拨入 api 领任务真抓 Amazon。
  # profile 门控——默认 up 不启动；需 TPS 代理 + 注册令牌就位后显式起：
  #   ERP_WORKER_ENROLL_TOKEN=<令牌> PROXY_URL=http://user:pwd@tps:port \
  #     docker compose -f infra/docker-compose.yml --profile scraper up -d --build scraper
  scraper:
    build: ../workers
    restart: unless-stopped
    command:
      - "--server"
      - "http://api:8000"
      - "--enroll-token"
      - "${ERP_WORKER_ENROLL_TOKEN:-}"
      - "--proxy"
      - "${PROXY_URL:-}"
      - "--node-key"
      - "${ERP_WORKER_NODE_KEY:-erp-scraper-1}"
    volumes:
      - scraper_state:/root/.erp_worker
    depends_on:
      api: {condition: service_started}
    profiles: ["scraper"]

  # 生产前端（INFRA-0716）：构建产物 + nginx 静态伺服，默认随 up 启动。
  # 部署 = up -d --build frontend（重建镜像即换版本；index.html 不缓存 + hashed
  # 资产不可变——根治 dev vite 的 stale 模块事故：HF-0716①/FE-0716 两起同源）。
  # 端口保持 5173，Owner 访问地址不变。
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api: {condition: service_started}

  # 开发用 vite（HMR；仅本地开发显式启用，与生产 frontend 端口互斥不可同起）：
  #   docker compose -f infra/docker-compose.yml --profile dev up -d frontend-dev
  frontend-dev:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      # 容器内 API 走 docker 网络名（vite.config.ts 读取；宿主机跑 vite 时无需此变量）
      VITE_API_PROXY_TARGET: http://api:8000
    # corepack 按 package.json 的 packageManager 钉死 pnpm 版本（曾因拉到 pnpm 11 导致 install 失败）
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    profiles: ["dev"]

volumes:
  pgdata:
  scraper_state:

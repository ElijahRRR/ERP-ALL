[project]
name = "erp-backend"
version = "0.1.0"
description = "ERP-ALL 后端（FastAPI 模块化单体）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",                     # 服务层函数参数数由 CR 把关，不由 lint 一刀切
    "RUF001", "RUF002", "RUF003",  # 中文文案/注释的全角标点是本项目惯例
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
"alembic/versions/*" = ["E501"]  # 手写 SQL 的行宽以可读为准

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["erp"]
strict = true
# 渐进式：R1 期允许的豁免点集中列在这里，R2 收紧
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
package = true
